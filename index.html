<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚓ الملاح البحري</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a1628;--panel:rgba(13,27,42,.88);--accent:#00d4ff;--accent2:#ff6b35;--text:#e8f1f8;--muted:#7a93a8;--green:#00e676;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text)}
  #mapWrap{position:relative;width:100%;height:calc(100vh - 170px);min-height:300px}
  #map{width:100%;height:100%;background:#0d1b2a}
  #topBar{position:absolute;top:12px;right:12px;left:12px;z-index:1000;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
  #layerBar{display:flex;gap:6px;pointer-events:auto;background:var(--panel);backdrop-filter:blur(12px);border:1px solid rgba(0,212,255,.15);border-radius:14px;padding:4px}
  #layerBar button{background:transparent;color:var(--muted);border:none;padding:8px 12px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;border-radius:10px}
  #layerBar button.active{background:var(--accent);color:#04121f}
  #btnSeaInfo{pointer-events:auto;background:var(--panel);backdrop-filter:blur(12px);border:1px solid rgba(255,107,53,.3);color:var(--accent2);padding:8px 14px;border-radius:14px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700}
  #clearDest{position:absolute;bottom:20px;left:12px;z-index:1000;display:none;background:rgba(255,82,82,.92);color:#fff;border:none;padding:10px 16px;border-radius:14px;cursor:pointer;font-family:inherit;font-weight:700}
  #infoBar{position:fixed;bottom:0;right:0;left:0;z-index:1100;display:flex;justify-content:space-around;align-items:center;padding:10px 8px 16px;background:var(--panel);backdrop-filter:blur(16px);border-top:1px solid rgba(0,212,255,.2)}
  .stat{text-align:center;flex:1}
  .stat .label{font-size:10px;color:var(--muted);font-weight:700}
  .stat .value{font-size:18px;font-weight:900;color:var(--accent)}
  .stat .unit{font-size:10px;color:var(--muted)}
  #speedBox .value{color:var(--green)}
  .divider{width:1px;height:32px;background:rgba(122,147,168,.25)}
  #seaCard{position:absolute;top:70px;right:12px;left:12px;z-index:1000;display:none;padding:14px;border-radius:18px;background:var(--panel);backdrop-filter:blur(16px);border:1px solid rgba(0,212,255,.2)}
  #seaCard h3{margin:0 0 10px;font-size:15px;color:var(--accent)}
  #seaRow{display:flex;justify-content:space-around;text-align:center}
  #seaRow b{display:block;font-size:20px;font-weight:900}
  #seaRow span{font-size:11px;color:var(--muted)}
  #seaState{margin-top:12px;padding:8px;border-radius:10px;text-align:center;font-size:13px;font-weight:700;background:rgba(0,212,255,.08)}
  .boat-arrow{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:26px solid var(--accent2);filter:drop-shadow(0 0 6px rgba(255,107,53,.7))}
  #logo{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:999;pointer-events:none;font-weight:900;font-size:15px;color:var(--accent);text-shadow:0 2px 8px rgba(0,0,0,.8)}
  #gpsStatus{position:absolute;bottom:14px;right:12px;z-index:1000;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(255,82,82,.9);display:none}
</style>
</head>
<body>
<div id="mapWrap">
  <div id="map"></div>
  <div id="logo">⚓ الملاح البحري</div>
  <div id="topBar">
    <div id="layerBar">
      <button id="btnSat" class="active">🛰️ قمر</button>
      <button id="btnStreet">🗺️ خريطة</button>
      <button id="btnDepth" class="active">📊 أعماق</button>
    </div>
    <button id="btnSeaInfo">🌊 حالة البحر</button>
  </div>
  <div id="seaCard">
    <h3>🌊 حالة البحر الآن</h3>
    <div id="seaRow">
      <div><b id="waveHeight">--</b><span>الموج (م)</span></div>
      <div><b id="waveDir">--</b><span>اتجاه الموج</span></div>
      <div><b id="wavePeriod">--</b><span>الفترة (ث)</span></div>
    </div>
    <div id="seaState">--</div>
  </div>
  <button id="clearDest">✖ إلغاء الوجهة</button>
  <div id="gpsStatus">📡 لا توجد إشارة GPS</div>
</div>
<div id="infoBar">
  <div class="stat" id="speedBox"><div class="label">السرعة</div><div class="value" id="speed">0.0</div><div class="unit" id="speedUnit">كم/س</div></div>
  <div class="divider"></div>
  <div class="stat"><div class="label">الاتجاه</div><div class="value" id="bearing">--°</div><div class="unit">درجة</div></div>
  <div class="divider"></div>
  <div class="stat"><div class="label">المسافة</div><div class="value" id="distance">--</div><div class="unit">للوجهة</div></div>
  <div class="divider"></div>
  <div class="stat"><div class="label">الوقت</div><div class="value" id="time">--:--</div><div class="unit">الوصول</div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
var map = L.map('map').setView([36.87,10.348],14ullah);
</script>
</body>
</html>
