<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redline Fishing</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07111f">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 15px;
      text-align: center;
      background: #0d2138;
      font-size: 21px;
      font-weight: bold;
    }

    #map {
      width: 100%;
      height: 65vh;
      min-height: 350px;
    }

    .panel {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px;
      background: #1595d1;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    button.stop {
      background: #d83b45;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 10px;
    }

    .card {
      background: #102b45;
      padding: 10px;
      border-radius: 9px;
      text-align: center;
    }

    .value {
      display: block;
      font-size: 18px;
      color: #43d6ff;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <header>🎣 Redline Fishing</header>

  <div id="map"></div>

  <div class="info">
    <div class="card">
      السرعة
      <span id="speed" class="value">0 كم/س</span>
    </div>

    <div class="card">
      المسافة
      <span id="distance" class="value">0 م</span>
    </div>

    <div class="card">
      المدة
      <span id="time" class="value">00:00</span>
    </div>

    <div class="card">
      النقاط
      <span id="points" class="value">0</span>
    </div>
  </div>

  <div class="panel">
    <button onclick="locate()">📍 موقعي</button>
    <button onclick="addPoint()">🎯 حفظ نقطة</button>
    <button onclick="startTrack()">▶️ بدء الرحلة</button>
    <button class="stop" onclick="stopTrack()">⏹ إيقاف</button>
    <button onclick="exportGPX()">📤 تصدير GPX</button>
    <button onclick="clearTrack()">🗑 مسح</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([24.7, 46.7], 6);

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }
    ).addTo(map);

    let marker = null;
    let watch = null;
    let route = [];
    let line = null;
    let points = [];
    let startTime = null;
    let timer = null;

    function locate() {
      if (!navigator.geolocation) {
        alert('المتصفح لا يدعم تحديد الموقع');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const x = [
            position.coords.latitude,
            position.coords.longitude
          ];

          map.setView(x, 16);

          if (marker) {
            marker.setLatLng(x);
          } else {
            marker = L.marker(x).addTo(map);
          }

          marker.bindPopup('موقعك الحالي').openPopup();
        },
        function() {
          alert('يرجى السماح بالوصول إلى الموقع والتأكد من استخدام HTTPS');
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function startTrack() {
      if (watch !== null) {
        return;
      }

      if (!navigator.geolocation) {
        alert('المتصفح لا يدعم تحديد الموقع');
        return;
      }

      route = [];
      startTime = Date.now();

      updateTime();
      timer = setInterval(updateTime, 1000);

      watch = navigator.geolocation.watchPosition(
        function(position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const currentPoint = [latitude, longitude];

          route.push({
            lat: latitude,
            lng: longitude,
            speed: position.coords.speed || 0
          });

          if (marker) {
            marker.setLatLng(currentPoint);
          } else {
            marker = L.marker(currentPoint)
              .addTo(map)
              .bindPopup('موقعك الحالي');
          }

          if (line) {
            line.setLatLngs(
              route.map(function(point) {
                return [point.lat, point.lng];
              })
            );
          } else {
            line = L.polyline(
              route.map(function(point) {
                return [point.lat, point.lng];
              }),
              {
                color: '#ff304f',
                weight: 5
              }
            ).addTo(map);
          }

          map.setView(currentPoint);
          updateStats();
        },
        function() {
          alert('تعذر تحديد الموقع. تأكد من تفعيل GPS والسماح بالموقع');
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );
    }

    function stopTrack() {
      if (watch !== null) {
        navigator.geolocation.clearWatch(watch);
        watch = null;
      }

      if (timer !== null) {
        clearInterval(timer);
        timer = null;
      }
    }

    function updateStats() {
      let distance = 0;

      for (let i = 1; i < route.length; i++) {
        distance += map.distance(
          [route[i - 1].lat, route[i - 1].lng],
          [route[i].lat, route[i].lng]
        );
      }

      document.getElementById('distance').textContent =
        Math.round(distance) + ' م';

      const lastPoint =
        route.length > 0 ? route[route.length - 1] : null;

      const speed = lastPoint ? lastPoint.speed : 0;

      document.getElementById('speed').textContent =
        (speed * 3.6).toFixed(1) + ' كم/س';
    }

    function updateTime() {
      if (!startTime) {
        return;
      }

      const secondsPassed =
        Math.floor((Date.now() - startTime) / 1000);

      const minutes = String(
        Math.floor(secondsPassed / 60)
      ).padStart(2, '0');

      const seconds = String(
        secondsPassed % 60
      ).padStart(2, '0');

      document.getElementById('time').textContent =
        minutes + ':' + seconds;
    }

    function addPoint() {
      if (!marker) {
        alert('حدد موقعك أولاً بالضغط على زر "موقعي"');
        locate();
        return;
      }

      const position = marker.getLatLng();

      points.push(position);

      L.marker(position)
        .addTo(map)
        .bindPopup('نقطة صيد رقم ' + points.length)
        .openPopup();

      document.getElementById('points').textContent =
        points.length;
    }

    function exportGPX() {
      if (route.length === 0) {
        alert('لا توجد رحلة مسجلة');
        return;
      }

      const trackPoints = route.map(function(point) {
        return '<trkpt lat="' + point.lat +
          '" lon="' + point.lng + '"></trkpt>';
      }).join('');

      const gpx =
        '<?xml version="1.0" encoding="UTF-8"?>' +
        '<gpx version="1.1" creator="Redline Fishing" ' +
        'xmlns="http://www.topografix.com/GPX/1/1">' +
        '<trk><name>Redline Fishing</name><trkseg>' +
        trackPoints +
        '</trkseg></trk></gpx>';

      const file = new Blob(
        [gpx],
        { type: 'application/gpx+xml;charset=utf-8' }
      );

      const url = URL.createObjectURL(file);
      const link = document.createElement('a');

      link.href = url;
      link.download = 'redline-fishing.gpx';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    }

    function clearTrack() {
      stopTrack();

      route = [];
      points = [];
      startTime = null;

      if (line) {
        map.removeLayer(line);
        line = null;
      }

      document.getElementById('distance').textContent = '0 م';
      document.getElementById('speed').textContent = '0 كم/س';
      document.getElementById('time').textContent = '00:00';
      document.getElementById('points').textContent = '0';
    }

    window.addEventListener('load', function() {
      setTimeout(function() {
        map.invalidateSize();
      }, 300);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js')
          .catch(function(error) {
            console.error('Service Worker error:', error);
          });
      });
    }
  </script>

</body>
</html>
```
