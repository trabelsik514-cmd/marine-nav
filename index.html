<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎣 GPS الصياد</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
html, body { width:100%; height:100%; }
body { display:flex; flex-direction:column; }
#topbar { background:#01579b; color:#fff; padding:10px; text-align:center; font-size:16px; }
#toolbar { display:flex; flex-wrap:wrap; gap:6px; padding:8px; background:#eceff1; z-index:1000; }
#toolbar button { flex:1; min-width:60px; padding:10px 4px; border:none; border-radius:8px; color:#fff; font-size:14px; cursor:pointer; }
#map { flex:1; min-height:250px; width:100%; z-index:1; }
#dist { background:#0277bd; color:#fff; padding:8px; text-align:center; font-size:18px; }
#msg { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#000c; color:#fff; padding:8px 16px; border-radius:20px; display:none; z-index:9999; }
#spotsList { position:fixed; inset:0; background:#fff; z-index:9998; display:none; overflow:auto; padding:16px; }
#spotsList button { display:block; width:100%; margin:6px 0; padding:12px; background:#0277bd; color:#fff; border:none; border-radius:8px; font-size:16px; }
</style>
</head>
<body>
<div id="topbar">📍 جاري تحديد الموقع...</div>
<div id="toolbar">
  <button id="destBtn" style="background:#2e7d32">🎯 هدف</button>
  <button id="depthBtn" style="background:#00695c">📉 أعماق</button>
  <button id="seaBtn" style="background:#283593">🌊 بحر</button>
  <button id="trackBtn" style="background:#8e24aa">📉 مسار</button>
  <button id="spotsBtn" style="background:#c62828">📋 نقاطي</button>
</div>
<div id="map"></div>
<div id="dist">--</div>
<div id="msg"></div>
<div id="spotsList"><h3>📋 نقاطي</h3><div id="spotsDiv"></div><br>
<button onclick="document.getElementById('spotsList').style.display='none'">❌ إغلاق</button></div>

<script>
function showMsg(m){ var e=document.getElementById('msg'); e.textContent=m; e.style.display='block'; setTimeout(function(){e.style.display='none';},2500); }

var map = L.map('map').setView([36.77,10.22], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
setTimeout(function(){ map.invalidateSize(); },500);

var depthLayer=null, seaLayer=null;
document.getElementById('depthBtn').onclick=function(){
  if(depthLayer){ map.removeLayer(depthLayer); depthLayer=null; this.style.background='#00695c'; }
  else{
    depthLayer = L.tileLayer.wms('https://ows.emodnet-bathymetry.eu/wms',{layers:'emodnet:mean_2016',format:'image/png',transparent:true,opacity:0.6}).addTo(map);
    this.style.background='#00e676'; showMsg('📉 طبقة الأعماق ✅');
  }
};
document.getElementById('seaBtn').onclick=function(){
  if(seaLayer){ map.removeLayer(seaLayer); seaLayer=null; this.style.background='#283593'; }
  else{
    seaLayer = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
    this.style.background='#00e676'; showMsg('🌊 العلامات البحرية ✅');
  }
};

var spots = JSON.parse(localStorage.getItem('spots')||'[]');
function saveSpots(){ localStorage.setItem('spots', JSON.stringify(spots)); }

var myPos=null, myMarker=null, destMarker=null, currentDest=null;
function dist(a,b){ var R=6371000,dLa=(b.lat-a.lat)*Math.PI/180,dLo=(b.lng-a.lng)*Math.PI/180;
  var x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }

map.on('click', function(e){
  currentDest = e.latlng;
  if(destMarker) destMarker.setLatLng(e.latlng);
  else destMarker = L.circleMarker(e.latlng,{radius:10,color:'#2e7d32',fillColor:'#2e7d32',fillOpacity:1}).addTo(map);
  showMsg('🎯 تم تحديد الهدف');
});

document.getElementById('destBtn').onclick=function(){ showMsg('👆 اضغط على الخريطة لتحديد الهدف'); };

document.getElementById('spotsBtn').onclick=function(){
  var d=document.getElementById('spotsDiv'); d.innerHTML='';
  if(!spots.length) d.innerHTML='<p>لا توجد نقاط بعد</p>';
  spots.forEach(function(s){
    var b=document.createElement('button');
    b.textContent='📌 '+s.name;
    b.onclick=function(){ map.setView([s.lat,s.lng],14); document.getElementById('spotsList').style.display='none'; };
    d.appendChild(b);
  });
  document.getElementById('spotsList').style.display='block';
};

var tracking=false, trackPoints=[], trackLine=null;
document.getElementById('trackBtn').onclick=function(){
  tracking=!tracking;
  if(tracking){ trackPoints=[]; showMsg('📉 بدأ تسجيل المسار'); this.style.background='#00e676'; }
  else{
    var td=0;
    for(var i=1;i<trackPoints.length;i++)
      td+=dist({lat:trackPoints[i-1][0],lng:trackPoints[i-1][1]},{lat:trackPoints[i][0],lng:trackPoints[i][1]});
    showMsg(' المسار: '+(td/1000).toFixed(2)+' km');
    this.style.background='#8e24aa';
  }
};

function onPos(pos){
  myPos = {lat:pos.coords.latitude, lng:pos.coords.longitude};
  document.getElementById('topbar').textContent = '📍 '+myPos.lat.toFixed(5)+', '+myPos.lng.toFixed(5);
  if(!myMarker) myMarker = L.circleMarker([myPos.lat,myPos.lng],{radius:10,color:'#0277bd',fillColor:'#0277bd',fillOpacity:1}).addTo(map);
  else myMarker.setLatLng([myPos.lat,myPos.lng]);
  if(tracking) trackPoints.push([myPos.lat,myPos.lng]);
  if(trackLine) map.removeLayer(trackLine);
  if(trackPoints.length>1) trackLine = L.polyline(trackPoints,{color:'#8e24aa'}).addTo(map);
  if(currentDest){
    var d = dist(myPos,currentDest);
    document.getElementById('dist').textContent = '🎯 المسافة: '+(d>1000?(d/1000).toFixed(2)+' km':Math.round(d)+' m');
  } else document.getElementById('dist').textContent = '--';
}
function gpsError(){ document.getElementById('topbar').textContent='⚠️ جاري تحديد الموقع...'; }
navigator.geolocation.watchPosition(onPos,gpsError,{enableHighAccuracy:true,maximumAge:2000});
</script>
</body>
</html>
