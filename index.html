<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#d32f2f">
<title>Redline Fishing 🔴</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'Segoe UI', Tahoma, Arial, sans-serif; background:#1a1a2e; height:100vh; overflow:hidden; }

/* ===== شاشة البداية ===== */
#splash { position:fixed; inset:0; background:linear-gradient(160deg,#0d1b2a,#1b263b,#d32f2f); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
#splash h1 { color:#fff; font-size:34px; letter-spacing:2px; text-shadow:0 3px 10px rgba(0,0,0,.5); }
#splash h1 span { color:#ff5252; }
#splash .kayak { font-size:80px; animation:float 2.5s ease-in-out infinite; }
#splash .line { width:60%; height:3px; background:linear-gradient(90deg,transparent,#ff5252,transparent); }
#splash p { color:#aebacf; font-size:14px; }
@keyframes float { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-15px) rotate(3deg)} }

/* ===== الهيدر ===== */
#header { position:fixed; top:0; left:0; right:0; height:56px; background:linear-gradient(90deg,#b71c1c,#d32f2f); display:flex; align-items:center; justify-content:space-between; padding:0 14px; z-index:1000; box-shadow:0 2px 8px rgba(0,0,0,.4); }
#header .title { color:#fff; font-weight:bold; font-size:18px; }
#header .title span { color:#ffcdd2; }
#coords { color:#fff; font-size:13px; font-family:monospace; direction:ltr; text-align:left; }
#coords small { display:block; color:#ffcdd2; font-size:10px; }

/* ===== الخريطة ===== */
#map { position:absolute; top:56px; bottom:0; left:0; right:0; z-index:1; }

/* ===== شريط الأزرار ===== */
#toolbar { position:fixed; bottom:12px; left:10px; right:10px; display:flex; gap:8px; overflow-x:auto; padding:8px 4px; z-index:1000; scrollbar-width:none; }
#toolbar::-webkit-scrollbar { display:none; }
.btn { flex-shrink:0; background:rgba(20,20,35,.92); backdrop-filter:blur(8px); border:1px solid #d32f2f; color:#fff; border-radius:14px; padding:10px 14px; font-size:13px; font-weight:bold; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:66px; cursor:pointer; transition:transform .15s; }
.btn:active { transform:scale(.92); }
.btn .ico { font-size:20px; }
.btn.active { background:#d32f2f; box-shadow:0 0 12px rgba(255,60,60,.6); }
.btn.call { background:#25D366; border-color:#25D366; }

/* ===== الإشعارات ===== */
#toast { position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-20px); background:#d32f2f; color:#fff; padding:10px 20px; border-radius:20px; font-size:14px; z-index:2000; opacity:0; transition:all .3s; pointer-events:none; }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ===== معلومات المسار ===== */
#trackInfo { position:fixed; top:66px; right:10px; background:rgba(20,20,35,.9); color:#fff; padding:8px 12px; border-radius:10px; font-size:12px; z-index:900; display:none; border:1px solid #d32f2f; direction:ltr; }
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="splash">
  <div class="kayak">🛶</div>
  <h1>Redline <span>Fishing</span></h1>
  <div class="line"></div>
  <p>🎖️ دليل الصيد بالكاياك</p>
</div>

<!-- الهيدر -->
<div id="header">
  <div class="title">Redline <span>Fishing</span> 🔴</div>
  <div id="coords">--.-----, --.-----<small>🧭 <span id="heading">--</span>°</small></div>
</div>

<!-- معلومات المسار -->
<div id="trackInfo"></div>

<!-- الخريطة -->
<div id="map"></div>

<!-- شريط الأزرار -->
<div id="toolbar">
  <div class="btn" id="btnLocate"><span class="ico">🎯</span>موقعي</div>
  <div class="btn" id="btnSea"><span class="ico">🌊</span>البحر</div>
  <div class="btn" id="btnDepth"><span class="ico">📊</span>أعماق</div>
  <div class="btn" id="btnTrack"><span class="ico">🗺️</span>مسار</div>
  <div class="btn" id="btnSave"><span class="ico">💾</span>حفظ النقطة</div>
  <div class="btn" id="btnPoints"><span class="ico">📋</span>نقاطي</div>
  <div class="btn call" id="btnCall"><span class="ico">📞</span>المجموعة</div>
  <div class="btn call" id="btnShare"><span class="ico">📤</span>موقعي للغروب</div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ⚙️ الإعدادات — ⚠️ ضع رابط غروب WhatsApp هنا! */
const WHATSAPP_GROUP_URL = "https://chat.whatsapp.com/XXXXXXXXXXXXXXX"; // ← بدّله برابط غروبكم

/* ===== شاشة البداية ===== */
setTimeout(()=>{ document.getElementById('splash').style.display='none'; }, 2200);

/* ===== الخريطة ===== */
const map = L.map('map').setView([36.77, 10.22], 13);

const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' });
const seaLayer = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', { maxZoom:18, attribution:'© OpenSeaMap' });
const baseLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 });
baseLayer.addTo(map);
let seaOn = false;

/* طبقة الأعماق */
let depthOn = false, depthLayer = null;
function toggleDepth(){
  depthOn = !depthOn;
  document.getElementById('btnDepth').classList.toggle('active', depthOn);
  if(depthOn){
    depthLayer = L.tileLayer.wms('https://map.openseamap.org/map/', {
      layers:'depths', format:'image/png', transparent:true, opacity:0.7
    }).addTo(map);
    toast('📊 خطوط الأعماق مفعّلة');
  } else if(depthLayer){ map.removeLayer(depthLayer); depthLayer=null; toast('📊 الأعماق متوقفة'); }
}

/* ===== GPS ===== */
let myMarker=null, accuracyCircle=null, heading=0;
function onGPS(pos){
  const lat=pos.coords.latitude, lng=pos.coords.longitude, acc=pos.coords.accuracy;
  document.getElementById('coords').innerHTML =
    lat.toFixed(5)+', '+lng.toFixed(5)+'<small>🧭 '+Math.round(pos.coords.heading||0)+'° · دقة '+Math.round(acc)+'م</small>';
  if(!myMarker){
    myMarker = L.marker([lat,lng]).addTo(map)
      .bindPopup('🎣 موقعك').openPopup();
    accuracyCircle = L.circle([lat,lng],{radius:acc,color:'#d32f2f',fillOpacity:.08}).addTo(map);
    map.setView([lat,lng],15);
  } else {
    myMarker.setLatLng([lat,lng]);
    accuracyCircle.setLatLng([lat,lng]).setRadius(acc);
  }
  if(trackOn) trackPoints.push([lat,lng]), drawTrack();
}
navigator.geolocation.watchPosition(onGPS, err=>toast('⚠️ فعّل الموقع!'), {enableHighAccuracy:true, maximumAge:1000});

/* ===== الأزرار ===== */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

document.getElementById('btnLocate').onclick = ()=>{
  if(myMarker){ map.setView(myMarker.getLatLng(),16); toast('🎯 موقعك الحالي'); }
  else toast('⏳ في انتظار إشارة GPS...');
};

document.getElementById('btnSea').onclick = ()=>{
  seaOn=!seaOn;
  document.getElementById('btnSea').classList.toggle('active',seaOn);
  if(seaOn){ map.removeLayer(baseLayer); map.addLayer(seaLayer).addLayer(L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19})); toast('🌊 خريطة البحر مفعّلة'); }
  else { location.reload(); }
};

document.getElementById('btnDepth').onclick = toggleDepth;

/* ===== المسار ===== */
let trackOn=false, trackPoints=[], trackLine=null, trackDist=0, lastPos=null;
document.getElementById('btnTrack').onclick = ()=>{
  trackOn=!trackOn;
  document.getElementById('btnTrack').classList.toggle('active',trackOn);
  document.getElementById('trackInfo').style.display = trackOn?'block':'none';
  toast(trackOn?'🗺️ بدأ تسجيل المسار':'🗺️ توقف التسجيل');
};

function drawTrack(){
  if(trackLine) map.removeLayer(trackLine);
  trackLine = L.polyline(trackPoints,{color:'#ff1744',weight:4}).addTo(map);
  if(lastPos){
    const p=trackPoints[trackPoints.length-1];
    trackDist += map.distance(lastPos,p)/1000;
  }
  lastPos = trackPoints[trackPoints.length-1];
  const spd = trackPoints.length>1 ? calcSpeed() : 0;
  document.getElementById('trackInfo').innerHTML =
    '📏 المسافة: '+trackDist.toFixed(2)+' كم<br>⚡ السرعة: '+spd.toFixed(1)+' كم/س<br>📍 نقاط: '+trackPoints.length;
}

function calcSpeed(){
  if(trackPoints.length<2) return 0;
  const a=trackPoints[trackPoints.length-2], b=trackPoints[trackPoints.length-1];
  const dKm=map.distance(a,b)/1000;
  return dKm*3600; // نقطة كل ثانية تقريباً
}

/* ===== حفظ النقاط ===== */
let points = JSON.parse(localStorage.getItem('redline_points')||'[]');
points.forEach(p=>L.marker([p.lat,p.lng]).addTo(map).bindPopup('🎣 '+p.name));

document.getElementById('btnSave').onclick = ()=>{
  if(!myMarker){ toast('⏳ انتظر GPS...'); return; }
  const ll=myMarker.getLatLng();
  const name='🎣 نقطة '+(points.length+1);
  points.push({lat:ll.lat,lng:ll.lng,name:name});
  localStorage.setItem('redline_points',JSON.stringify(points));
  L.marker([ll.lat,ll.lng]).addTo(map).bindPopup(name);
  toast('💾 تم حفظ النقطة!');
};

document.getElementById('btnPoints').onclick = ()=>{
  if(!points.length){ toast('📋 لا توجد نقاط محفوظة'); return; }
  let html='📋 نقاطك:\n\n';
  points.forEach((p,i)=>html+=(i+1)+'. '+p.name+'\n '+p.lat.toFixed(5)+', '+p.lng.toFixed(5)+'\n https://maps.google.com/?q='+p.lat+','+p.lng+'\n\n');
  alert(html);
};

/* ===== 📞 زر المجموعة (WhatsApp) ===== */
document.getElementById('btnCall').onclick = ()=>{
  if(WHATSAPP_GROUP_URL.includes('XXXX'))
document.getElementById('btnCall').onclick = ()=>{
  if(WHATSAPP_GROUP_URL.includes('XXXX')){
    toast('⚠️ ضع رابط الغروب في إعدادات الكود أولاً!');
    return;
  }
  window.open(WHATSAPP_GROUP_URL,'_blank');
  toast('📞 فتح غروب المجموعة');
};

/* ===== 📤 إرسال موقعي للغروب ===== */
document.getElementById('btnShare').onclick = ()=>{
  if(!myMarker){ toast('⏳ انتظر إشارة GPS...'); return; }
  const ll=myMarker.getLatLng();
  const msg=encodeURIComponent(
    '🎣 موقعي الآن (Redline Fishing):\n'+
    '📍 '+ll.lat.toFixed(5)+', '+ll.lng.toFixed(5)+'\n'+
    '🗺️ https://maps.google.com/?q='+ll.lat+','+ll.lng
  );
  window.open('https://wa.me/?text='+msg,'_blank');
  toast('📤 تم تجهيز موقعك للإرسال للغروب');
};

/* ===== تصدير GPX ===== */
function exportGPX(){
  if(trackPoints.length<2){ toast('⚠️ لا يوجد مسار مسجّل'); return; }
  let gpx='<?xml version="1.0"?><gpx version="1.1"><trk><name>Redline Track</name><trkseg>';
  trackPoints.forEach(p=>gpx+='<trkpt lat="'+p[0]+'" lon="'+p[1]+'"></trkpt>');
  gpx+='</trkseg></trkseg></gpx>';
  const blob=new Blob([gpx],{type:'application/gpx+xml'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='redline-track.gpx';
  a.click();
  toast('📥 تم تصدير المسار GPX');
}

/* ===== إخفاء شاشة البداية عند اللمس ===== */
document.getElementById('splash').onclick = ()=>{
  document.getElementById('splash').style.display='none';
};
</script>
</body>
</html>
