<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redline Fishing</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07111f">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:white;font-family:Arial}
header{padding:15px;text-align:center;background:#0d2138;font-size:21px;font-weight:bold}
#map{height:65vh}.panel{padding:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
button{border:0;border-radius:10px;padding:13px;background:#1595d1;color:white;font-size:15px}
button.stop{background:#d83b45}.info{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px}
.card{background:#102b45;padding:10px;border-radius:9px;text-align:center}.value{display:block;font-size:18px;color:#43d6ff}
</style>
</head>
<body>

<header>🎣 Redline Fishing</header>
<div id="map"></div>

<div class="info">
 <div class="card">السرعة<span id="speed" class="value">0 كم/س</span></div>
 <div class="card">المسافة<span id="distance" class="value">0 م</span></div>
 <div class="card">المدة<span id="time" class="value">00:00</span></div>
 <div class="card">النقاط<span id="points" class="value">0</span></div>
</div>

<div class="panel">
<button onclick="locate()">📍 موقعي</button>
<button onclick="addPoint()">🎯 حفظ نقطة</button>
<button onclick="startTrack()">▶️ بدء الرحلة</button>
<button class="stop" onclick="stopTrack()">⏹ إيقاف</button>
<button onclick="exportGPX()">📤 تصدير GPX</button>
<button onclick="clearTrack()">🗑 مسح</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([24.7,46.7],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{attribution:'© OpenStreetMap'}).addTo(map);

let marker,watch,route=[],line,points=[],startTime,timer;

function locate(){
 navigator.geolocation.getCurrentPosition(p=>{
  const x=[p.coords.latitude,p.coords.longitude];
  map.setView(x,16);
  if(marker)marker.setLatLng(x);else marker=L.marker(x).addTo(map);
 },()=>alert('يرجى السماح بالوصول إلى الموقع'));
}

function startTrack(){
 if(watch)return;
 route=[];startTime=Date.now();
 timer=setInterval(updateTime,1000);
 watch=navigator.geolocation.watchPosition(p=>{
  const x=[p.coords.latitude,p.coords.longitude];
  route.push({lat:x[0],lng:x[1],speed:p.coords.speed||0});
  if(line)line.setLatLngs(route.map(a=>[a.lat,a.lng]));
  else line=L.polyline(route.map(a=>[a.lat,a.lng]),{color:'#ff304f',weight:5}).addTo(map);
  map.setView(x); updateStats();
 },e=>alert('تعذر تحديد الموقع'));
}

function stopTrack(){
 if(watch){navigator.geolocation.clearWatch(watch);watch=null}
 clearInterval(timer);
}

function updateStats(){
 let d=0;
 for(let i=1;i<route.length;i++)
  d+=map.distance([route[i-1].lat,route[i-1].lng],[route[i].lat,route[i].lng]);
 document.getElementById('distance').textContent=Math.round(d)+' م';
 let s=route.at(-1)?.speed||0;
 document.getElementById('speed').textContent=(s*3.6).toFixed(1)+' كم/س';
}

function updateTime(){
 if(!startTime)return;
 let n=Math.floor((Date.now()-startTime)/1000);
 document.getElementById('time').textContent=
 String(Math.floor(n/60)).padStart(2,'0')+':'+String(n`).padStart(2,'0');
}

function addPoint(){
 if(!marker)return locate();
 let p=marker.getLatLng();
 points.push(p);L.marker(p).addTo(map).bindPopup('نقطة صيد').openPopup();
 document.getElementById('points').textContent=points.length;
}

function exportGPX(){
 if(!route.length)return alert('لا توجد رحلة مسجلة');
 let tr=route.map(p=>`<trkpt lat="${p.lat}" lon="${p.lng}"></trkpt>`).join('');
 let g=`<?xml version="1.0"?><gpx version="1.1"><trk><name>Redline Fishing</name><trkseg>${tr}</trkseg></trk></gpx>`;
 let a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([g],{type:'application/gpx+xml'}));
 a.download='redline-fishing.gpx';a.click();
}

function clearTrack(){
 stopTrack();route=[];points=[];if(line)map.removeLayer(line);line=null;
 document.getElementById('distance').textContent='0 م';
 document.getElementById('points').textContent='0';
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
