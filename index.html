
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Redline Fishing</title>
<link rel="icon" href="https://i.imgur.com/sE2H0uM.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#0f0f1a;color:#eee;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#splash{position:fixed;inset:0;background:#0f0f1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s}
#splash img{width:150px;animation:p 2s infinite}
#splash h1{margin-top:16px;color:#e63946}
@keyframes p{50%{transform:scale(1.07)}}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#1a1a2e;border-bottom:2px solid #e63946}
header img{width:38px;height:38px;border-radius:8px}
#hInfo{flex:1;min-width:0}#hInfo h1{font-size:16px}#hInfo h1 span,#gpsLine b{color:#e63946}
#gpsLine{font-size:12px;color:#aaa;white-space:nowrap;overflow:hidden}
#dot{width:11px;height:11px;border-radius:50%;background:#555}
#dot.on{background:#2ecc71;box-shadow:0 0 8px #2ecc71}
#tb,.row{display:flex;gap:6px;padding:8px;background:#16162a;z-index:1000;overflow-x:auto}
.row{padding:0 8px 8px}
.tb{flex-shrink:0;padding:10px 13px;border:0;border-radius:10px;color:#fff;font-size:14px;font-weight:bold;cursor:pointer}
.red{background:#e63946}.purple{background:#7b2cbf}.navy{background:#1d3557}
.teal{background:#0e7c6b}.green{background:#2a9d3f}.orange{background:#e07b00;flex:1}.brown{background:#5a3a2a;flex:1}
.active{outline:3px solid #fff}
#map{flex:1;background:#0f0f1a}
#bb{display:flex;background:#1a1a2e;border-top:2px solid #e63946;padding:8px 4px}
.st{flex:1;text-align:center;font-size:17px;font-weight:bold}.st small{display:block;font-size:10px;color:#888}
.r{color:#e63946}
#panel{position:fixed;inset:0;background:#0009;z-index:2000;display:none;align-items:flex-end}
#panel.show{display:flex}
#pc{background:#1a1a2e;width:100%;max-height:70vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px;border-top:3px solid #e63946}
#pc h2{color:#e63946;font-size:17px;margin-bottom:14px}
.spot{display:flex;align-items:center;gap:12px;padding:12px;background:#222240;border-radius:10px;margin-bottom:8px}
.info{flex:1}.info b{display:block;font-size:14px}.info small{color:#888;font-size:11px}
.go,.del{cursor:pointer}.go{color:#e63946;font-weight:bold}.del{color:#f77}
.empty{text-align:center;color:#777;padding:24px}
.cb{width:100%;padding:12px;background:#e63946;color:#fff;border:0;border-radius:10px;font-size:15px;margin-top:10px}
#toast{position:fixed;bottom:70px;left:50%;transform:translate(-50%,80px);background:#e63946;color:#fff;padding:12px 24px;border-radius:24px;transition:.3s;z-index:3000;white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="splash">
<img src="https://i.imgur.com/sE2H0uM.png">
<h1>Redline Fishing</h1>
<p style="color:#888;margin-top:6px">GPS لصيادي الكاياك 🛶🎣</p>
</div>

<header>
<img src="https://i.imgur.com/sE2H0uM.png">
<div id="hInfo"><h1>Redline <span>Fishing</span></h1><div id="gpsLine">🧭 -- | <b>--</b> 📍</div></div>
<div id="dot"></div>
</header>

<div id="tb">
<button class="tb green" onclick="centerMe()">🎯 هدفي</button>
<button class="tb teal" onclick="toggleDepth()">📊 أعماق</button>
<button class="tb navy" onclick="toggleSea()">🌊 بحر</button>
<button class="tb purple" id="trkBtn" onclick="toggleTrack()">🗺️ مسار</button>
<button class="tb red" onclick="openSpots()">📋 نقاطي</button>
</div>

<div class="row">
<button class="tb orange" onclick="saveSpot()">💾 حفظ</button>
<button class="tb brown" onclick="exportGPX()">📤 GPX</button>
</div>

<div id="map"></div>

<div id="bb">
<div class="st"><span id="sSpd" class="r">0.0</span><small>سرعة km/h</small></div>
<div class="st"><span id="sTim">00:00</span><small>المدة</small></div>
<div class="st"><span id="sDst" class="r">0.00</span><small>المسافة كم</small></div>
<div class="st"><span id="sMax">0.0</span><small>أقصى</small></div>
</div>

<div id="panel" onclick="if(event.target===this)closePanel()">
<div id="pc">
<h2>🎯 نقاط الصيد المحفوظة</h2>
<div id="sList"></div>
<button class="cb" onclick="closePanel()">إغلاق</button>
</div>
</div>

<div id="toast"></div>

<script>
let map,marker,accC,trackLine,depthLayer,seaLayer,selectedMarker,pos=null;
let tracking=false,trackPts=[],totalDist=0,maxSpd=0,startTime=null,lastPos=null;
const $=id=>document.getElementById(id);

map=L.map('map').setView([36.7786,10.2279],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,attribution:'© OpenStreetMap'
}).addTo(map);

const myIcon=L.icon({
 iconUrl:'https://i.imgur.com/sE2H0uM.png',
 iconSize:[34,34],iconAnchor:[17,17]
});

function hav(a,b,c,d){
 const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;
 const q=Math.sin(x/2)**2+
 Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;
 return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
}

function startGPS(){
 if(!navigator.geolocation){
  toast('⚠️ المتصفح لا يدعم GPS');return;
 }
 navigator.geolocation.watchPosition(p=>{
  $('dot').classList.add('on');pos=p;
  const {latitude:la,longitude:ln,accuracy:ac,speed,heading}=p.coords;
  const hd=heading!=null&&!isNaN(heading)?Math.round(heading)+'°':'--';
  $('gpsLine').innerHTML='🧭 '+hd+' | <b>'+la.toFixed(5)+','+ln.toFixed(5)+'</b> 📍';

  if(!marker){
   marker=L.marker([la,ln],{icon:myIcon}).addTo(map);
   accC=L.circle([la,ln],{radius:ac,color:'#e63946',fillOpacity:.08}).addTo(map);
   map.setView([la,ln],15);
  }else{
   marker.setLatLng([la,ln]);
   accC.setLatLng([la,ln]).setRadius(ac);
  }

  const kmh=speed!=null&&!isNaN(speed)?Math.max(0,speed*3.6):0;
  $('sSpd').textContent=kmh.toFixed(1);

  if(tracking){
   maxSpd=Math.max(maxSpd,kmh);
   $('sMax').textContent=maxSpd.toFixed(1);
   trackPts.push([la,ln]);

   if(!trackLine)
    trackLine=L.polyline(trackPts,{color:'#e63946',weight:4}).addTo(map);
   else trackLine.setLatLngs(trackPts);

   if(lastPos)totalDist+=hav(lastPos[0],lastPos[1],la,ln);
   $('sDst').textContent=totalDist.toFixed(2);

   const sec=Math.floor((Date.now()-startTime)/1000);
   $('sTim').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  }
  lastPos=[la,ln];

 },()=>{
  $('dot').classList.remove('on');
  toast('⚠️ فعّل GPS واسمح بالوصول إلى الموقع');
 },{
  enableHighAccuracy:true,maximumAge:2000,timeout:10000
 });
}

function toggleTrack(){
 tracking=!tracking;
 const b=$('trkBtn');

 if(tracking){
  trackPts=[];totalDist=0;maxSpd=0;startTime=Date.now();lastPos=null;
  if(trackLine){map.removeLayer(trackLine);trackLine=null}
  $('sDst').textContent='0.00';$('sMax').textContent='0.0';
  b.classList.add('active');toast('🔴 بدأ تسجيل المسار');
 }else{
  b.classList.remove('active');toast('📊 الرحلة: '+totalDist.toFixed(2)+' كم');
 }
}

function saveSpot(){
 if(!pos){toast('⚠️ في انتظار GPS...');return}
 const sp=JSON.parse(localStorage.getItem('redline_spots')||'[]');
 sp.push({
  name:'نقطة '+new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}),
  lat:pos.coords.latitude,lng:pos.coords.longitude,
  date:new Date().toLocaleDateString('ar')
 });
 localStorage.setItem('redline_spots',JSON.stringify(sp));
 toast('✅ تم حفظ النقطة');
}

function openSpots(){renderSpots();$('panel').classList.add('show')}
function closePanel(){$('panel').classList.remove('show')}

function renderSpots(){
 const sp=JSON.parse(localStorage.getItem('redline_spots')||'[]');
 if(!sp.length){
  $('sList').innerHTML='<div class="empty">لا توجد نقاط محفوظة بعد</div>';return;
 }
 $('sList').innerHTML=sp.map((s,i)=>{
  const d=pos?hav(pos.coords.latitude,pos.coords.longitude,s.lat,s.lng).toFixed(2)+' كم':'--';
  return `<div class="spot">
  <div class="info"><b>🎣 ${s.name}</b><small>${s.lat.toFixed(4)}, ${s.lng.toFixed(4)} • ${d}</small></div>
  <div class="go" onclick="goTo(${s.lat},${s.lng})">اذهب ↗</div>
  <div class="del" onclick="delSpot(${i})">🗑️</div>
  </div>`;
 }).join('');
}

function delSpot(i){
 const sp=JSON.parse(localStorage.getItem('redline_spots')||'[]');
 sp.splice(i,1);
 localStorage.setItem('redline_spots',JSON.stringify(sp));
 renderSpots();toast('🗑️ تم الحذف');
}

function goTo(la,ln){
 closePanel();map.setView([la,ln],16);
 if(selectedMarker)map.removeLayer(selectedMarker);
 selectedMarker=L.marker([la,ln]).addTo(map);
 toast('🧭 عرض النقطة');
}

function centerMe(){
 if(pos)map.setView([pos.coords.latitude,pos.coords.longitude],16);
 else toast('⚠️ في انتظار GPS...');
}

function toggleDepth(){
 if(depthLayer){
  map.removeLayer(depthLayer);depthLayer=null;toast('📉 إخفاء الأعماق');return;
 }
 depthLayer=L.tileLayer(
 'https://tiles.arcgis.com/tiles/P3ePLMYs2RVChkJx/arcgis/rest/services/World_Bathymetry/MapServer/tile/{z}/{y}/{x}',
 {maxZoom:15,opacity:.7}
 ).addTo(map);
 toast('📊 عرض الأعماق');
}

function toggleSea(){
 if(seaLayer){
  map.removeLayer(seaLayer);seaLayer=null;toast('🌊 إخفاء علامات البحر');return;
 }
 seaLayer=L.tileLayer(
 'https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',
 {maxZoom:18}
 ).addTo(map);
 toast('🌊 علامات البحر');
}

function exportGPX(){
 if(!trackPts.length){toast('⚠️ ابدأ تسجيل المسار أولاً');return}
 let g='<?xml version="1.0" encoding="UTF-8"?>\\n';
 g+='<gpx version="1.1" creator="Redline Fishing">\\n<trk><trkseg>\\n';
 trackPts.forEach(p=>g+=`<trkpt lat="${p[0]}" lon="${p[1]}"></trkpt>\\n`);
 g+='</trkseg></trk></gpx>';

 const blob=new Blob([g],{type:'application/gpx+xml'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='redline-track.gpx';
 a.click();
 URL.revokeObjectURL(a.href);
 toast('📤 تم تصدير المسار');
}

function toast(m){
 const t=$('toast');
 t.textContent=m;t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),2500);
}

window.addEventListener('load',()=>{
 setTimeout(()=>{
  const splash=$('splash');
  if(splash){
   splash.style.opacity='0';
   setTimeout(()=>splash.remove(),700);
  }
  startGPS();
 },2200);
});
</script>
</body>
</html>
