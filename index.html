<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚓ الملاح البحري</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a1628; --panel:rgba(13,27,42,.85); --accent:#00d4ff;
    --accent2:#ff6b35; --text:#e8f1f8; --muted:#7a93a8; --green:#00e676; --red:#ff5252;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); }

  #mapWrap { position:relative; width:100%; height:calc(100vh - 175px); min-height:300px; }
  #map { width:100%; height:100%; background:#0d1b2a; }

  /* ====== شريط علوي زجاجي ====== */
  #topBar {
    position:absolute; top:12px; right:12px; left:12px; z-index:1000;
    display:flex; justify-content:space-between; align-items:center; pointer-events:none;
  }
  #layerBar { display:flex; gap:6px; pointer-events:auto; }
  .glass {
    background:var(--panel); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(0,212,255,.15); border-radius:14px;
    box-shadow:0 4px 20px rgba(0,0,0,.45);
  }
  #layerBar button {
    background:transparent; color:var(--muted); border:none; padding:8px 12px;
    cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; border-radius:10px;
    transition:all .25s;
  }
  #layerBar button.active { background:var(--accent); color:#04121f; }

  #btnSeaInfo {
    pointer-events:auto; background:var(--panel); backdrop-filter:blur(12px);
    border:1px solid rgba(255,107,53,.3); color:var(--accent2);
    padding:8px 14px; border-radius:14px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:700;
    box-shadow:0 4px 20px rgba(0,0,0,.45); transition:all .25s;
  }
  #btnSeaInfo:active { transform:scale(.94); }

  #clearDest {
    position:absolute; bottom:20px; left:12px; z-index:1000; display:none;
    background:rgba(255,82,82,.92); color:#fff; border:none; padding:10px 16px;
    border-radius:14px; cursor:pointer; font-family:inherit; font-weight:700; font-size:14px;
    box-shadow:0 4px 15px rgba(255,82,82,.4);
  }

  /* ====== شريط المعلومات السفلي ====== */
  #infoBar {
    position:fixed; bottom:0; right:0; left:0; z-index:1100;
    display:flex; justify-content:space-around; align-items:center;
    padding:10px 8px 14px; border-radius:22px 22px 0 0;
    background:var(--panel); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-top:1px solid rgba(0,212,255,.2);
  }
  .stat { text-align:center; flex:1; cursor:default; transition:transform .2s; }
  .stat:active { transform:scale(.92); }
  .stat .label { font-size:10px; color:var(--muted); font-weight:600; letter-spacing:.5px; }
  .stat .value { font-size:18px; font-weight:900; color:var(--accent); line-height:1.3; }
  .stat .unit { font-size:10px; color:var(--muted); font-weight:600; }
  #speedBox .value { color:var(--green); }
  .divider { width:1px; height:32px; background:rgba(122,147,168,.25); }

  /* ====== بطاقة البحر ====== */
  #seaCard {
    position:absolute; top:70px; right:12px; left:12px; z-index:1000; display:none;
    padding:14px; border-radius:18px;
    background:var(--panel); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(0,212,255,.2); box-shadow:0 8px 30px rgba(0,0,0,.5);
    animation:slideDown .3s ease;
  }
  @keyframes slideDown { from{opacity:0; transform:translateY(-12px)} to{opacity:1; transform:none} }
  #seaCard h3 { margin:0 0 10px; font-size:15px; color:var(--accent); display:flex; align-items:center; gap:8px; }
  #seaRow { display:flex; justify-content:space-around; text-align:center; }
  #seaRow b { display:block; font-size:20px; font-weight:900; color:var(--text); }
  #seaRow span { font-size:11px; color:var(--muted); }
  #seaState {
    margin-top:12px; padding:8px; border-radius:10px; text-align:center;
    font-size:13px; font-weight:700; background:rgba(0,212,255,.08);
  }

  /* ====== سهم القارب ====== */
  .boat-arrow {
    width:0; height:0;
    border-left:11px solid transparent; border-right:11px solid transparent;
    border-bottom:26px solid var(--accent2);
    filter:drop-shadow(0 0 6px rgba(255,107,53,.7));
  }

  /* ====== شعار ====== */
  #logo {
    position:absolute; top:-2px; left:50%; transform:translateX(-50%); z-index:999;
    pointer-events:none; font-weight:900; font-size:15px; color:var(--accent);
    text-shadow:0 2px 8px rgba(0,0,0,.8);
  }

  /* شريط تنبيه GPS */
  #gpsStatus {
    position:absolute; bottom:14px; right:12px; z-index:1000;
    padding:6px 12px; border-radius:20px; font-size:11px; font-weight:700;
    background:rgba(255,82,82,.9); display:none;
  }
</style>
</head>
<body>

<div id="mapWrap">
  <div id="map"></div>
  <div id="logo">⚓ الملاح البحري</div>

  <div id="topBar">
    <div id="layerBar" class="glass">
      <button id="btnSat" class="active">🛰️ قمر</button>
      <button id="btnStreet">🗺️ خريطة</button>
      <button id="btnDepth">📊 أعماق</button>
    </div>
    <button id="btnSeaInfo">🌊 حالة البحر</button>
  </div>

  <div id="seaCard">
    <h3>🌊 حالة البحر الآن</h3>
    <div id="seaRow">
      <div><b id="waveHeight">--</b><span>الموج (م)</span></div>
      <div><b id="waveDir">--</b><span>اتجاه الموج</span></div>
      <div><b id="wavePeriod">--</b><span>الفترة (ث)</span></div>
    </div>
    <div id="seaState">--</div>
  </div>

  <button id="clearDest">✖ إلغاء الوجهة</button>
  <div id="gpsStatus">📡 لا توجد إشارة GPS</div>
</div>

<div id="infoBar">
  <div class="stat" id="speedBox"><div class="label">السرعة</div><div class="value" id="speed">0.0</div><div class="unit" id="speedUnit">كم/س</div></div>
  <div class="divider"></div>
  <div class="stat"><div class="label">الاتجاه</div><div class="value" id="bearing">--°</div><div class="unit">درجة</div></div>
  <div class="divider"></div>
  <div class="stat"><div class="label">المسافة</div><div class="value" id="distance">--</div><div class="unit">للوجهة</div></div>
  <div class="divider"></div>
  <div class="stat"><div class="label">الوقت</div><div class="value" id="time">--:--</div><div class="unit">الوصول</div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  'use strict';

  /* ================= الخريطة ================= */
  var map = L.map('map').setView([36.87, 10.348], 14);

  var satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:18});
  var streetLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19});
  var seamarkLayer = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {maxZoom:18});

  satLayer.addTo(map);
  seamarkLayer.addTo(map);

  var depthOn = false;
  var depthLayer = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {maxZoom:18});

  function switchLayer(show, hide, btn){
    map.removeLayer(hide); show.addTo(map); seamarkLayer.addTo(map);
    if (depthOn) depthLayer.addTo(map);
    document.querySelectorAll('#layerBar button').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
  }
  document.getElementById('btnSat').onclick = function(){ switchLayer(satLayer, streetLayer, this); };
  document.getElementById('btnStreet').onclick = function(){ switchLayer(streetLayer, satLayer, this); };
  document.getElementById('btnDepth').onclick = function(){
    depthOn = !depthOn;
    this.classList.toggle('active', depthOn);
    depthOn ? depthLayer.addTo(map) : map.removeLayer(depthLayer);
  };

  /* ================= الحالة ================= */
  var userMarker=null, destMarker=null, routeLine=null;
  var destination=null, userPos=null, lastSpeed=0, prevPos=null;
  var gpsStatus = document.getElementById('gpsStatus');

  try {
    var saved = localStorage.getItem('dest');
    if (saved) { var s = JSON.parse(saved); setDestination(L.latLng(s.lat, s.lng)); }
  } catch(e){}

  /* ================= حسابات ================= */
  function haversine(la1, lo1, la2, lo2){
    var R=6371000, rad=function(d){return d*Math.PI/180;};
    var a = Math.sin(rad(la2-la1)/2)**2 + Math.cos(rad(la1))*Math.cos(rad(la2))*Math.sin(rad(lo2-lo1)/2)**2;
    return 2*R*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  function bearing(la1, lo1, la2, lo2){
    var rad=function(d){return d*Math.PI/180;};
    var y = Math.sin(rad(lo2-lo1))*Math.cos(rad(la2));
    var x = Math.cos(rad(la1))*Math.sin(rad(la2))-Math.sin(rad(la1))*Math.cos(rad(la2))*Math.cos(rad(lo2-lo1));
    return (Math.atan2(y,x)*180/Math.PI+360)%360;
  }
  function dirName(deg){
    return ['شمال','شمال شرق','شرق','جنوب شرق','جنوب','جنوب غرب','غرب','شمال غرب'][Math.round(deg/45)%8];
  }

  /* ================= المسار ================= */
  function updateRoute(){
    if (!userPos || !destination) return;
    if (routeLine) routeLine.setLatLngs([userPos, destination]);
    else routeLine = L.polyline([userPos, destination], {color:'#00d4ff', weight:4, dashArray:'10'});
    routeLine.addTo(map);
    }

    var d = haversine(userPos.lat, userPos.lng, destination.lat, destination.lng);
    document.getElementById('distance').textContent = d>=1000 ? (d/1000).toFixed(2)+' كم' : d.toFixed(0)+' م';
    document.getElementById('bearing').textContent = Math.round(bearing(userPos.lat,userPos.lng,destination.lat,destination.lng))+'°';

    if (lastSpeed > 0.25){
      var m = Math.round(d/lastSpeed/60);
      document.getElementById('time').textContent = m>=60 ? Math.floor(m/60)+'س '+(m%60)+'د' : m+' د';
    } else document.getElementById('time').textContent = '--:--';
  }

  /* ================= الوجهة ================= */
  function setDestination(ll){
    destination = ll;
    if (destMarker) destMarker.setLatLng(ll);
    else destMarker = L.marker(ll, {icon: L.divIcon({html:'<div style="font-size:32px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));">🏁</div>', iconSize:[32,32], iconAnchor:[16,32], className:''})}).addTo(map);
    document.getElementById('clearDest').style.display = 'block';
    updateRoute();
  }

  map.on('click', function(e){
    setDestination(e.latlng);
    try { localStorage.setItem('dest', JSON.stringify({lat:e.latlng.lat, lng:e.latlng.lng})); } catch(err){}
  });

  document.getElementById('clearDest').onclick = function(){
    destination = null;
    if (destMarker){ map.removeLayer(destMarker); destMarker=null; }
    if (routeLine){ map.removeLayer(routeLine); routeLine=null; }
    this.style.display = 'none';
    document.getElementById('distance').textContent='--';
    document.getElementById('time').textContent='--:--';
    document.getElementById('bearing').textContent='--°';
    try { localStorage.removeItem('dest'); } catch(err){}
  };

  /* ================= السرعة ================= */
  var speedUnit='kmh';
  document.getElementById('speedBox').onclick = function(){
    speedUnit = speedUnit==='kmh' ? 'knots' : 'kmh';
    document.getElementById('speedUnit').textContent = speedUnit==='kmh' ? 'كم/س' : 'عقدة';
    showSpeed();
  };
  function showSpeed(){
    var v = speedUnit==='kmh' ? lastSpeed*3.6 : lastSpeed*1.94384;
    document.getElementById('speed').textContent = v.toFixed(1);
  }

  /* ================= GPS ================= */
  if (navigator.geolocation){
    navigator.geolocation.watchPosition(function(pos){
      gpsStatus.style.display = 'none';
      userPos = L.latLng(pos.coords.latitude, pos.coords.longitude);
      var s = pos.coords.speed;
      lastSpeed = (s!==null && s>=0) ? s : 0;
      if (!lastSpeed && prevPos){
        var dt = (pos.timestamp - prevPos.t)/1000;
        if (dt>0){
          var dd = haversine(prevPos.lat, prevPos.lng, userPos.lat, userPos.lng);
          if (dd/dt > 0.3) lastSpeed = dd/dt;
        }
      }
      prevPos = {lat:userPos.lat, lng:userPos.lng, t:pos.timestamp};

      var rot = destination ? bearing(userPos.lat,userPos.lng,destination.lat,destination.lng) : 0;
      var icon = L.divIcon({html:'<div class="boat-arrow" style="transform:rotate('+rot+'deg);"></div>', iconSize:[24,26], iconAnchor:[12,13], className:''});

      if (userMarker) userMarker.setLatLng(userPos).setIcon(icon);
      else userMarker = L.marker(userPos, {icon:icon}).addTo(map);

      showSpeed();
      updateRoute();
      if (!map.getBounds().pad(0.2).contains(userPos)) map.panTo(userPos);
    }, function(err){
      gpsStatus.style.display = 'block';
    },
    { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
  } else {
    gpsStatus.style.display = 'block';
  }

  /* ================= حالة البحر ================= */
  function douglas(h){
    if (h < 0.1)  return '🔴 بحر ميت — لا يوجد موج تقريباً';
    if (h < 0.5)  return '🟢 هادئ — مثالي للصيد والقوارب الصغيرة';
    if (h < 1.25) return '🟢 خف — مناسب للقوارب الصغيرة';
    if (h < 2.5)  return '🟡 متوسط — حذر مع القوارب الصغيرة';
    if (h < 4)    return '🟠 عالٍ — خطير على القوارب الصغيرة';
    return '🔴 عالٍ جداً — خطر على جميع القوارب';
  }

  function getSeaState(lat, lng){
    document.getElementById('seaState').textContent = '⏳ جاري التحميل...';
    fetch('https://marine-api.open-meteo.com/v1/marine?latitude='+lat+'&longitude='+lng+'&current=wave_height,wave_direction,wave_period')
      .then(function(r){ return r.json(); })
      .then(function(data){
        var c = data.current;
        if (!c || c.wave_height === null || c.wave_height === undefined){
          document.getElementById('seaState').textContent = '⚠️ لا توجد بيانات بحرية لهذه المنطقة';
          document.getElementById('waveHeight').textContent='--';
          document.getElementById('waveDir').textContent='--';
          document.getElementById('wavePeriod').textContent='--';
          return;
        }
        document.getElementById('waveHeight').textContent = c.wave_height.toFixed(2);
        document.getElementById('waveDir').textContent = dirName(c.wave_direction);
        document.getElementById('wavePeriod').textContent = c.wave_period !== null ? c.wave_period.toFixed(0) : '--';
        document.getElementById('seaState').textContent = douglas(c.wave_height);
      })
      .catch(function(){
        document.getElementById('seaState').textContent = '⚠️ خطأ في الاتصال — تحقق من الإنترنت';
      });
  }

  document.getElementById('btnSeaInfo').onclick = function(){
    var card = document.getElementById('seaCard');
    if (card.style.display === 'block'){ card.style.display = 'none'; return; }
    card.style.display = 'block';
    var loc = userPos || map.getCenter();
    getSeaState(loc.lat, loc.lng);
  };

  /* ================= إصلاح الخريطة ================= */
  map.invalidateSize();
  setTimeout(function(){ map.invalidateSize(); }, 500);
  setTimeout(function(){ map.invalidateSize(); }, 1500);
  window.addEventListener('resize', function(){ map.invalidateSize(); });
  window.addEventListener('orientationchange', function(){
    setTimeout(function(){ map.invalidateSize(); }, 300);
  });

})();
</script>
</body>
</html>
