<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Redline Fishing 🎣</title>
<link rel="icon" href="https://i.imgur.com/sE2H0uM.png">
<link rel="apple-touch-icon" href="https://i.imgur.com/sE2H0uM.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'Segoe UI', Tahoma, sans-serif; background:#0f0f1a; color:#eee; min-height:100vh; }

/* ===== الشاشة الافتتاحية ===== */
#splash { position:fixed; inset:0; background:#0f0f1a; display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:999; transition:opacity .6s; }
#splash img { width:140px; animation:pulse 2s infinite; }
#splash h1 { margin-top:16px; font-size:26px; color:#e63946; letter-spacing:1px; }
#splash p { color:#888; margin-top:6px; font-size:13px; }
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }

/* ===== الهيدر ===== */
header { display:flex; align-items:center; gap:10px; padding:12px 16px;
  background:#1a1a2e; border-bottom:2px solid #e63946; position:sticky; top:0; z-index:10; }
header img { width:40px; height:40px; border-radius:8px; }
header h1 { font-size:18px; color:#fff; flex:1; }
header h1 span { color:#e63946; }
#statusDot { width:10px; height:10px; border-radius:50%; background:#555; }
#statusDot.on { background:#2ecc71; box-shadow:0 0 8px #2ecc71; }

/* ===== المحتوى ===== */
main { padding:16px; max-width:600px; margin:0 auto; }
.card { background:#1a1a2e; border-radius:14px; padding:16px; margin-bottom:14px;
  border:1px solid #2a2a4a; }
.card h2 { font-size:15px; color:#e63946; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.big { font-size:34px; font-weight:700; color:#fff; text-align:center; }
.big small { font-size:14px; color:#888; font-weight:400; }
.row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #2a2a4a; font-size:14px; }
.row:last-child { border:none; }
.row .val { color:#e63946; font-weight:600; }

/* ===== الأزرار ===== */
button { width:100%; padding:14px; border:none; border-radius:12px; font-size:16px;
  font-weight:700; cursor:pointer; margin-top:10px; transition:transform .1s; }
button:active { transform:scale(.97); }
#btnTrack { background:#e63946; color:#fff; }
#btnTrack.active { background:#7a1020; }
#btnSave { background:transparent; color:#e63946; border:2px solid #e63946; }

/* ===== قائمة النقاط ===== */
.spot { display:flex; align-items:center; gap:12px; padding:12px; background:#222240;
  border-radius:10px; margin-bottom:8px; }
.spot .icon { font-size:24px; }
.spot .info { flex:1; }
.spot .info b { font-size:14px; display:block; }
.spot .info small { color:#888; font-size:12px; }
.spot .go { color:#e63946; font-size:13px; font-weight:700; cursor:pointer; }
.empty { text-align:center; color:#666; padding:20px; font-size:13px; }

/* ===== الإشعارات ===== */
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px);
  background:#e63946; color:#fff; padding:12px 24px; border-radius:24px; font-size:14px;
  font-weight:600; transition:transform .3s; z-index:99; white-space:nowrap; }
#toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="splash">
  <img src="https://i.imgur.com/sE2H0uM.png" alt="Redline Fishing">
  <h1>Redline Fishing</h1>
  <p>GPS لصيادي الكاياك 🛶🎣</p>
</div>

<header>
  <img src="https://i.imgur.com/sE2H0uM.png" alt="لوغو">
  <h1>Redline <span>Fishing</span></h1>
  <div id="statusDot"></div>
</header>

<main>
  <!-- الموقع الحالي -->
  <div class="card">
    <h2>📍 موقعك الحالي</h2>
    <div class="big" id="speed">0.0 <small>عقدة</small></div>
    <div class="row"><span>الإحداثيات</span><span class="val" id="coords">--</span></div>
    <div class="row"><span>الدقة</span><span class="val" id="accuracy">--</span></div>
    <div class="row"><span>الاتجاه</span><span class="val" id="heading">--</span></div>
  </div>

  <!-- التتبع -->
  <div class="card">
    <h2>🔴 تتبع الرحلة (Redline)</h2>
    <div class="row"><span>المسافة المقطوعة</span><span class="val" id="distance">0.0 كم</span></div>
    <div class="row"><span>مدة الرحلة</span><span class="val" id="duration">00:00</span></div>
    <div class="row"><span>أقصى سرعة</span><span class="val" id="maxSpeed">0.0 عقدة</span></div>
    <button id="btnTrack" onclick="toggleTrack()">▶️ بدء التتبع</button>
  </div>

  <!-- نقاط الصيد -->
  <div class="card">
    <h2>🎯 نقاط الصيد المحفوظة</h2>
    <div id="spotsList"><div class="empty">لا توجد نقاط محفوظة بعد</div></div>
    <button id="btnSave" onclick="saveSpot()">💾 حفظ موقعي كنقطة صيد</button>
  </div>
</main>

<div id="toast"></div>

<script>
let watchId=null, tracking=false, startPos=null, totalDist=0, maxSpd=0, startTime=null;
let lastPos=null;

const $=id=>document.getElementById(id);

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500); }

function fmtCoord(v,pos){ return v.toFixed(5)+'°'+(pos==='N'?' شمالاً':pos==='E'?' شرقاً':''); }

function startGPS(){
  if(!navigator.geolocation){ toast('❌ الجهاز لا يدعم GPS'); return; }
  watchId = navigator.geolocation.watchPosition(pos=>{
    $('statusDot').classList.add('on');
    const {latitude:lat, longitude:lng, accuracy:acc, speed, heading}=pos.coords;
    $('coords').textContent = lat.toFixed(4)+', '+lng.toFixed(4);
    $('accuracy').textContent = '±'+Math.round(acc)+' م';
    $('heading').textContent = heading!=null && !isNaN(heading) ? Math.round(heading)+'°' : '--';
    const knots = speed!=null && !isNaN(speed) ? speed*1.94384 : 0;
    $('speed').innerHTML = knots.toFixed(1)+' <small>عقدة</small>';
    if(tracking){
      maxSpd = Math.max(maxSpd,knots); $('maxSpeed').textContent = maxSpd.toFixed(1)+' عقدة';
      if(lastPos){
        totalDist += haversine(lastPos.lat,lastPos.lng,lat,lng);
        $('distance').textContent = totalDist.toFixed(2)+' كم';
      }
      const secs = Math.floor((Date.now()-startTime)/1000);
      $('duration').textContent = String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
    }
    lastPos={lat,lng};
  }, err=>{
    $('statusDot').classList.remove('on');
    toast('⚠️ فعّل GPS واسمح بالموقع');
  }, {enableHighAccuracy:true, maximumAge:2000, timeout:10000});
}

function haversine(la1,lo1,la2,lo2){
  const R=6371, dLa=(la2-la1)*Math.PI/180, dLo=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function toggleTrack(){
  tracking=!tracking;
  const btn=$('btnTrack');
  if(tracking){
    totalDist=0; maxSpd=0; startTime=Date.now(); lastPos=null;
    btn.textContent='⏸️ إيقاف التتبع'; btn.classList.add('active');
    toast('🔴 بدأ تتبع Redline!');
  } else {
    btn.textContent='▶️ بدء التتبع'; btn.classList.remove('active');
    toast('📊 انتهت الرحلة: '+totalDist.toFixed(2)+' كم');
  }
}

function saveSpot(){
  if(!lastPos){ toast('⚠️ في انتظار إشارة GPS...'); return; }
  const spots = JSON.parse(localStorage.getItem('redline_spots')||'[]');
  const name = 'نقطة '+new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
  spots.push({name, lat:lastPos.lat, lng:lastPos.lng, date:new Date().toLocaleDateString('ar')});
  localStorage.setItem('redline_spots',JSON.stringify(spots));
  renderSpots(); toast('✅ تم حفظ نقطة الصيد!');
}

function renderSpots(){
  const spots = JSON.parse(localStorage.getItem('redline_spots')||'[]');
  const list=$('spotsList');
  if(!spots.length){ list.innerHTML='<div class="empty">لا توجد نقاط محفوظة بعد</div>'; return; }
  list.innerHTML = spots.map((s,i)=>{
    const d = lastPos ? haversine(lastPos.lat,lastPos.lng,s.lat,s.lng).toFixed(2)+' كم' : '--';
    return `<div class="spot"><div class="icon">🎣</div>
      <div class="info"><b>s.name</b><small>{s.name}</b><small>s.name</b><small>{s.lat.toFixed(4)}, s.lng.toFixed(4)•{s.lng.toFixed(4)} •s.lng.toFixed(4)•{d}</small></div>
      <div class="go" onclick="navigate(s.lat,{s.lat},s.lat,{s.lng})">اذهب ↗</div></div>`;
  }).join('');
}

function navigate(lat,lng){
  window.open(`https://www.google.com/maps/dir/?api=1&destination=lat,{lat},lat,{lng}&travelmode=driving`);
  toast('🧭 فتح الملاحة...');
}

// تشغيل
setTimeout(()=>{ $('splash').style.opacity='0';
  setTimeout(()=>$('splash').remove(),700); }, 2200);
startGPS();
renderSpots();
</script>
</body>
</html>
