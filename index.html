<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redline Fishing</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        :root {
            --primary: #087ea4;
            --dark: #071923;
            --light: #f4f8fa;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            font-family: Arial, Tahoma, sans-serif;
            background: var(--light);
            color: #17232b;
        }

        button {
            font: inherit;
            border: 0;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            color: white;
            background: var(--primary);
            margin: 5px;
        }

        button:hover { opacity: 0.9; }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* شاشة البداية */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: var(--dark);
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        #splash-screen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #splash-screen img {
            width: min(78vw, 380px);
            max-height: 60vh;
            object-fit: contain;
            animation: appear 1.2s ease;
        }

        .splash-title {
            color: white;
            font-size: 30px;
            font-weight: bold;
            animation: appear 1.2s ease;
        }

        .splash-title span { color: var(--primary); }

        @keyframes appear {
            from { opacity: 0; transform: scale(0.85); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* التطبيق */
        #app-screen {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            color: white;
            background: var(--dark);
            font-size: 18px;
            font-weight: bold;
        }

        #map {
            flex: 1;
            width: 100%;
            min-height: 300px;
        }

        .controls {
            padding: 10px;
            text-align: center;
            background: white;
        }

        #weather-result {
            max-width: 600px;
            margin: 8px auto 4px;
            padding: 10px;
            border-radius: 10px;
            background: #eef7fa;
            line-height: 1.8;
        }

        .status-good   { color: #16803c; font-weight: bold; }
        .status-medium { color: #bd7500; font-weight: bold; }
        .status-bad    { color: #c62828; font-weight: bold; }
    </style>
</head>

<body>

    <!-- شاشة الشعار -->
    <div id="splash-screen">
        <img src="1789584118704.jpg" alt="شعار Redline Fishing"
             onerror="this.style.display='none';
             document.getElementById('splash-title').style.display='block';">
        <div class="splash-title" id="splash-title" style="display:none;">
            Redline <span>Fishing</span> 🎣
        </div>
    </div>

    <!-- شاشة التطبيق -->
    <section id="app-screen">
        <div class="top-bar">Redline Fishing</div>

        <div id="map"></div>

        <div class="controls">
            <button id="locate-button" type="button">تحديد موقعي</button>
            <button id="weather-button" type="button">جلب حالة البحر والطقس</button>

            <div id="weather-result">
                اضغط على زر جلب حالة البحر والطقس.
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const splashScreen = document.getElementById("splash-screen");
        const appScreen = document.getElementById("app-screen");
        const locateButton = document.getElementById("locate-button");
        const weatherButton = document.getElementById("weather-button");
        const weatherResult = document.getElementById("weather-result");

        let map = null;
        let userMarker = null;
        let currentLatitude = 36.8;
        let currentLongitude = 10.6;

        /* فتح التطبيق بعد الشعار */
        window.addEventListener("load", () => {
            setTimeout(() => {
                splashScreen.classList.add("hide");
                appScreen.style.display = "flex";
                initializeMap();
                setTimeout(() => map && map.invalidateSize(), 250);
            }, 2200);
        });

        /* تهيئة الخريطة */
        function initializeMap() {
            if (map) return;

            map = L.map("map").setView([currentLatitude, currentLongitude], 10);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }).addTo(map);

            userMarker = createUserMarker(
                [currentLatitude, currentLongitude],
                "موقع الكاياك الحالي"
            );
        }

        /* ماركر الكاياك بأيقونة إيموجي (لا تحتاج ملفات) */
        function createUserMarker(position, popupText) {
            const kayakIcon = L.divIcon({
                html: '<div style="font-size:34px;line-height:34px;text-align:center;">🛶</div>',
                className: "",
                iconSize: [34, 34],
                iconAnchor: [17, 17],
                popupAnchor: [0, -17]
            });

            return L.marker(position, { icon: kayakIcon })
                .addTo(map)
                .bindPopup(popupText);
        }

        /* تحديد موقع المستخدم */
        locateButton.addEventListener("click", () => {
            if (!navigator.geolocation) {
                alert("المتصفح لا يدعم تحديد الموقع.");
                return;
            }

            locateButton.disabled = true;
            locateButton.textContent = "جارٍ تحديد الموقع...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLatitude = position.coords.latitude;
                    currentLongitude = position.coords.longitude;

                    const pos = [currentLatitude, currentLongitude];

                    map.setView(pos, 13);

                    if (userMarker) map.removeLayer(userMarker);

                    userMarker = createUserMarker(pos, "موقعك الحالي 🎣");

                    locateButton.disabled = false;
                    locateButton.textContent = "تحديد موقعي";
                },
                () => {
                    alert("تعذر تحديد موقعك. تأكد من تفعيل خدمة الموقع.");
                    locateButton.disabled = false;
                    locateButton.textContent = "تحديد موقعي";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });

        /* جلب حالة البحر والطقس */
        weatherButton.addEventListener("click", async () => {
            weatherButton.disabled = true;
            weatherButton.textContent = "جارٍ جلب البيانات...";
            weatherResult.textContent = "جارٍ جلب البيانات، انتظر قليلاً...";

            try {
                const apiKey = "ضع_مفتاح_الطقس_هنا";

                const response = await fetch(
                    "https://api.openweathermap.org/data/2.5/weather" +
                    "?lat=" + currentLatitude +
                    "&lon=" + currentLongitude +
                    "&appid=" + apiKey +
                    "&units=metric&lang=ar"
                );

                if (!response.ok) {
                    throw new Error("فشل الاتصال بخدمة الطقس.");
                }

                const data = await response.json();

                const temperature = Math.round(data.main.temp);
                const windSpeed = data.wind.speed;
                const description = data.weather[0].description;

                /* تقييم حالة البحر حسب سرعة الرياح */
                let seaStatusText, seaStatusClass;

                if (windSpeed < 5) {
                    seaStatusText = "ممتازة ✅";
                    seaStatusClass = "status-good";
                } else if (windSpeed < 8) {
                    seaStatusText = "متوسطة ⚠️";
                    seaStatusClass = "status-medium";
                } else {
                    seaStatusText = "خطيرة ❌";
                    seaStatusClass = "status-bad";
                }

                weatherResult.innerHTML =
                    "📍 <strong>الموقع:</strong> " +
                    currentLatitude.toFixed(3) + ", " +
                    currentLongitude.toFixed(3) + "<br>" +
                    "🌡️ <strong>الطقس:</strong> " + description + "<br>" +
                    "🌡️ <strong>الحرارة:</strong> " + temperature + "°C<br>" +
                    "💨 <strong>سرعة الرياح:</strong> " +
                    windSpeed.toFixed(1) + " م/ث<br>" +
                    "🌊 <strong>حالة البحر للكاياك:</strong> " +
                    '<span class="' + seaStatusClass + '">' +
                    seaStatusText + "</span>";

                if (windSpeed >= 8) {
                    alert("⚠️ تحذير: حالة البحر خطيرة حالياً. يُنصح بعدم الخروج بالكاياك.");
                }
            } catch (error) {
                weatherResult.textContent = "تعذر جلب بيانات الطقس. حاول مرة أخرى.";
            } finally {
                weatherButton.disabled = false;
                weatherButton.textContent = "جلب حالة البحر والطقس";
            }
        });
    </script>
</body>
</html>
