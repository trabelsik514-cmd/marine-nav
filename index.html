<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redline Fishing</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        :root {
            --primary: #087ea4;
            --dark: #071923;
            --light: #f4f8fa;
            --danger: #c62828;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            background: var(--light);
            color: #17232b;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            color: white;
            background: var(--primary);
            margin: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        input {
            width: min(90%, 360px);
            padding: 12px;
            margin: 6px 0;
            border: 1px solid #ccd7dc;
            border-radius: 8px;
            background: white;
            direction: rtl;
        }

        /* شاشة البداية */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--dark);
            opacity: 1;
            visibility: visible;
            pointer-events: none;
            transition:
                opacity 0.7s ease,
                visibility 0.7s ease;
        }

        #splash-screen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #splash-screen img {
            width: min(78vw, 380px);
            max-height: 70vh;
            object-fit: contain;
            animation: logoAppear 1.2s ease;
        }

        @keyframes logoAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* شاشة الدخول */
        #auth-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: min(92vw, 420px);
            padding: 28px 20px;
            text-align: center;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .auth-logo {
            width: min(70vw, 250px);
            max-height: 150px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .auth-card h2 {
            margin-top: 5px;
            color: var(--dark);
        }

        #auth-message {
            min-height: 24px;
            margin-top: 10px;
            color: var(--danger);
            font-size: 14px;
        }

        /* التطبيق */
        #app-screen {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            background: var(--light);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            color: white;
            background: var(--dark);
        }

        .top-bar strong {
            font-size: 18px;
        }

        .top-bar button {
            margin: 0;
            padding: 8px 12px;
            background: var(--danger);
        }

        #map {
            width: 100%;
            height: 58vh;
            min-height: 350px;
        }

        .controls {
            padding: 12px;
            text-align: center;
            background: white;
        }

        #weather-result {
            max-width: 600px;
            margin: 10px auto 0;
            padding: 12px;
            border-radius: 10px;
            background: #eef7fa;
            line-height: 1.8;
        }

        .status-good {
            color: #16803c;
            font-weight: bold;
        }

        .status-medium {
            color: #bd7500;
            font-weight: bold;
        }

        .status-bad {
            color: #c62828;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- شاشة الشعار -->
    <div id="splash-screen">
        <img
            src="1789584118704.jpg"
            alt="شعار Redline Fishing"
        >
    </div>

    <!-- شاشة تسجيل الدخول -->
    <section id="auth-screen" class="hidden">
        <div class="auth-card">
            <img
                class="auth-logo"
                src="1789584118704.jpg"
                alt="Redline Fishing"
            >

            <h2>تسجيل الدخول</h2>

            <input
                type="email"
                id="email"
                placeholder="البريد الإلكتروني"
                autocomplete="email"
            >

            <input
                type="password"
                id="password"
                placeholder="كلمة السر"
                autocomplete="current-password"
            >

            <div>
                <button id="login-button" type="button">
                    دخول
                </button>

                <button id="register-button" type="button">
                    إنشاء حساب
                </button>
            </div>

            <div id="auth-message"></div>
        </div>
    </section>

    <!-- شاشة التطبيق -->
    <section id="app-screen">
        <div class="top-bar">
            <strong>Redline Fishing</strong>
            <button id="logout-button" type="button">تسجيل الخروج</button>
        </div>

        <div id="map"></div>

        <div class="controls">
            <button id="locate-button" type="button">
                تحديد موقعي
            </button>

            <button id="weather-button" type="button">
                جلب حالة البحر والطقس
            </button>

            <div id="weather-result">
                اضغط على زر جلب حالة البحر والطقس.
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
 // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAGKqjPxkdrPyZvBnGv2KJgraVdOUYeobs",
  authDomain: "marine-nav.firebaseapp.com",
  projectId: "marine-nav",
  storageBucket: "marine-nav.firebasestorage.app",
  messagingSenderId: "965847809562",
  appId: "1:965847809562:web:cfc643b71d32eead2a1ba3",
  measurementId: "G-MSGNN93HQ4"
  };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);

        const splashScreen = document.getElementById("splash-screen");
        const authScreen = document.getElementById("auth-screen");
        const appScreen = document.getElementById("app-screen");
        const authMessage = document.getElementById("auth-message");

        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("login-button");
        const registerButton = document.getElementById("register-button");
        const logoutButton = document.getElementById("logout-button");
        const locateButton = document.getElementById("locate-button");
        const weatherButton = document.getElementById("weather-button");
        const weatherResult = document.getElementById("weather-result");

        const WEATHER_DEFAULT_TEXT =
            "اضغط على زر جلب حالة البحر والطقس.";

        let map = null;
        let userMarker = null;
        let currentLatitude = 36.8;
        let currentLongitude = 10.6;

        /*
         * عرض الشعار لمدة 2.2 ثانية
         */
        window.addEventListener("load", () => {
            setTimeout(() => {
                splashScreen.classList.add("hide");
            }, 2200);
        });

        /*
         * إظهار الشاشة المناسبة حسب حالة المستخدم
         */
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authScreen.classList.add("hidden");
                appScreen.style.display = "flex";

                initializeMap();

                setTimeout(() => {
                    if (map) {
                        map.invalidateSize();
                    }
                }, 250);
            } else {
                authScreen.classList.remove("hidden");
                appScreen.style.display = "none";

                resetAppState();
            }
        });

        /*
         * إعادة تعيين حالة التطبيق عند تسجيل الخروج
         */
        function resetAppState() {
            currentLatitude = 36.8;
            currentLongitude = 10.6;

            weatherResult.textContent = WEATHER_DEFAULT_TEXT;

            if (map) {
                if (userMarker) {
                    map.removeLayer(userMarker);
                    userMarker = null;
                }

                map.setView(
                    [currentLatitude, currentLongitude],
                    10
                );
            }
        }

        /*
         * تهيئة الخريطة
         */
        function initializeMap() {
            if (map) {
                return;
            }

            map = L.map("map").setView(
                [currentLatitude, currentLongitude],
                10
            );

            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    maxZoom: 19,
                    attribution: "&copy; OpenStreetMap contributors"
                }
            ).addTo(map);

            userMarker = createUserMarker(
                [currentLatitude, currentLongitude],
                "موقع الكاياك الحالي"
            );
        }

        /*
         * إنشاء ماركر مع أيقونة الكاياك وخيار بديل عند فشل تحميل الصورة
         */
        function createUserMarker(position, popupText) {
            const kayakIcon = L.icon({
                iconUrl: "images/kayak-icon.png",
                iconSize: [42, 42],
                iconAnchor: [21, 21],
                popupAnchor: [0, -21]
            });

            const marker = L.marker(position, { icon: kayakIcon })
                .addTo(map)
                .bindPopup(popupText);

            /*
             * إذا فشل تحميل أيقونة الكاياك، استخدم الأيقونة الافتراضية
             */
            const iconElement = marker.getElement()?.querySelector("img");

            if (iconElement) {
                iconElement.addEventListener("error", () => {
                    marker.setIcon(new L.Icon.Default());
                }, { once: true });
            }

            return marker;
        }

        /*
         * تسجيل الدخول
         */
        loginButton.addEventListener("click", async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showAuthMessage("يرجى إدخال البريد الإلكتروني وكلمة السر.");
                return;
            }

            try {
                setAuthLoading(true);

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                showAuthMessage("");
            } catch (error) {
                showAuthMessage(getFirebaseErrorMessage(error));
            } finally {
                setAuthLoading(false);
            }
        });

        /*
         * إنشاء حساب جديد
         */
        registerButton.addEventListener("click", async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showAuthMessage("يرجى إدخال البريد الإلكتروني وكلمة السر.");
                return;
            }

            if (password.length < 6) {
                showAuthMessage(
                    "يجب أن تتكون كلمة السر من 6 أحرف أو أكثر."
                );
                return;
            }

            try {
                setAuthLoading(true);

                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                showAuthMessage("");
            } catch (error) {
                showAuthMessage(getFirebaseErrorMessage(error));
            } finally {
                setAuthLoading(false);
            }
        });

        /*
         * تسجيل الخروج
         */
        logoutButton.addEventListener("click", async () => {
            try {
                await signOut(auth);
            } catch (error) {
                alert("حدث خطأ أثناء تسجيل الخروج.");
            }
        });

        /*
         * تحديد موقع المستخدم
         */
        locateButton.addEventListener("click", () => {
            if (!navigator.geolocation) {
                alert("المتصفح لا يدعم تحديد الموقع.");
                return;
            }

            locateButton.disabled = true;
             locateButton.textContent = "جارٍ تحديد الموقع...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLatitude = position.coords.latitude;
                    currentLongitude = position.coords.longitude;

                    const positionArray = [
                        currentLatitude,
                        currentLongitude
                    ];

                    if (map) {
                        map.setView(positionArray, 13);

                        if (userMarker) {
                            map.removeLayer(userMarker);
                        }

                        userMarker = createUserMarker(
                            positionArray,
                            "موقعك الحالي 🎣"
                        );
                    }

                    locateButton.disabled = false;
                    locateButton.textContent = "تحديد موقعي";
                },
                (error) => {
                    alert(
                        "تعذر تحديد موقعك. تأكد من تفعيل خدمة الموقع."
                    );

                    locateButton.disabled = false;
                    locateButton.textContent = "تحديد موقعي";
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        });

        /*
         * جلب حالة البحر والطقس
         */
        weatherButton.addEventListener("click", async () => {
            weatherButton.disabled = true;
            weatherButton.textContent = "جارٍ جلب البيانات...";

            weatherResult.textContent = "جارٍ جلب البيانات، انتظر قليلاً...";

            try {
                const apiKey = "ضع_مفتاح_الطقس_هنا";

                const response = await fetch(
                    "https://api.openweathermap.org/data/2.5/weather" +
                    "?lat=" + currentLatitude +
                    "&lon=" + currentLongitude +
                    "&appid=" + apiKey +
                    "&units=metric" +
                    "&lang=ar"
                );

                if (!response.ok) {
                    throw new Error("فشل الاتصال بخدمة الطقس.");
                }

                const data = await response.json();

                const temperature = Math.round(data.main.temp);
                const windSpeed = data.wind.speed;
                const description = data.weather[0].description;

                /*
                 * تقييم حالة البحر حسب سرعة الرياح (متر/ثانية)
                 */
                let seaStatusText = "";
                let seaStatusClass = "";

                if (windSpeed < 5) {
                    seaStatusText = "ممتازة ✅";
                    seaStatusClass = "status-good";
                } else if (windSpeed < 8) {
                    seaStatusText = "متوسطة ⚠️";
                    seaStatusClass = "status-medium";
                } else {
                    seaStatusText = "خطيرة ❌";
                    seaStatusClass = "status-bad";
                }

                weatherResult.innerHTML =
                    "📍 <strong>الموقع:</strong> " +
                    currentLatitude.toFixed(3) + ", " +
                    currentLongitude.toFixed(3) +
                    "<br>" +
                    "🌡️ <strong>الطقس:</strong> " +
                    description +
                    "<br>" +
                    "🌡️ <strong>الحرارة:</strong> " +
                    temperature + "°C" +
                    "<br>" +
                    "💨 <strong>سرعة الرياح:</strong> " +
                    windSpeed.toFixed(1) + " م/ث" +
                    "<br>" +
                    "🌊 <strong>حالة البحر للكاياك:</strong> " +
                    '<span class="' + seaStatusClass + '">' +
                    seaStatusText +
                    "</span>";

                if (windSpeed >= 8) {
                    alert(
                        "⚠️ تحذير: حالة البحر خطيرة حالياً. " +
                        "يُنصح بعدم الخروج بالكاياك."
                    );
                }
            } catch (error) {
                weatherResult.textContent =
                    "تعذر جلب بيانات الطقس. حاول مرة أخرى.";
            } finally {
                weatherButton.disabled = false;
                weatherButton.textContent = "جلب حالة البحر والطقس";
            }
        });

        /*
         * ترجمة رسائل أخطاء Firebase إلى العربية
         */
        function getFirebaseErrorMessage(error) {
            const code = error?.code || "";

            switch (code) {
                case "auth/invalid-email":
                    return "البريد الإلكتروني غير صالح.";

                case "auth/user-not-found":
                    return "لا يوجد حساب بهذا البريد الإلكتروني.";

                case "auth/wrong-password":
                case "auth/invalid-credential":
                    return "كلمة السر غير صحيحة.";

                case "auth/email-already-in-use":
                    return "هذا البريد الإلكتروني مستخدم بالفعل.";

                case "auth/weak-password":
                    return "كلمة السر ضعيفة (6 أحرف على الأقل).";

                case "auth/too-many-requests":
                    return "محاولات كثيرة. انتظر قليلاً ثم حاول مجدداً.";

                case "auth/network-request-failed":
                    return "مشكلة في الاتصال بالإنترنت.";

                default:
                    return "حدث خطأ. حاول مرة أخرى.";
            }
        }

        function showAuthMessage(message) {
            authMessage.textContent = message;
        }

        function setAuthLoading(isLoading) {
            loginButton.disabled = isLoading;
            registerButton.disabled = isLoading;
        }
    </script>
</body>
</html>
