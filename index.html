</html>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Redline Fishing</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial;background:#0f0f1a;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px;background:#1a1a2e;border-bottom:2px solid #e63946;text-align:center}
header span{color:#e63946}
#gps{font-size:12px;color:#aaa;margin-top:5px}
#buttons{display:flex;gap:6px;padding:8px;background:#16162a;overflow:auto}
button{border:0;border-radius:8px;padding:11px;color:#fff;font-weight:bold;white-space:nowrap}
.green{background:#2a9d3f}.red{background:#e63946}.blue{background:#1d3557}
.orange{background:#e07b00}.purple{background:#7b2cbf}
#map{flex:1}
#info{display:flex;justify-content:space-around;background:#1a1a2e;border-top:2px solid #e63946;padding:10px}
small{display:block;color:#aaa;font-size:10px;text-align:center}
.boat-marker{background:transparent;border:0}
.boat-icon{display:block;width:40px;height:40px;font-size:32px;line-height:40px;text-align:center;transform-origin:center;filter:drop-shadow(0 2px 2px #000);transition:transform .3s linear}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#e63946;padding:12px 20px;border-radius:20px;display:none;z-index:5}
</style>
</head>

<body>
<header>
<h2>Redline <span>Fishing</span></h2>
<div id="gps">🧭 -- | 📍 في انتظار GPS</div>
</header>

<div id="buttons">
<button class="green" onclick="centerMe()">🎯 موقعي</button>
<button class="purple" onclick="toggleTrack()">🗺️ مسار</button>
<button class="red" onclick="saveSpot()">💾 حفظ النقطة</button>
<button class="blue" onclick="toggleSea()">🌊 البحر</button>
<button class="orange" onclick="toggleDepth()">📊 الأعماق</button>
</div>

<div id="map"></div>

<div id="info">
<div><b id="speed">0.0</b><small>سرعة km/h</small></div>
<div><b id="distance">0.00</b><small>المسافة كم</small></div>
<div><b id="max">0.0</b><small>أقصى سرعة</small></div>
</div>

<div id="toast"></div>

<script>
let map=L.map('map').setView([36.7786,10.2279],14),
 marker,accuracyCircle,position,
 track=[],line,tracking=false,distance=0,maxSpeed=0,last,
 sea,depth;

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,attribution:'© OpenStreetMap'
}).addTo(map);

const boatIcon=L.divIcon({
 className:'boat-marker',
 html:'<span class="boat-icon">🚤</span>',
 iconSize:[40,40],
 iconAnchor:[20,20]
});

function distanceKm(a,b,c,d){
 const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;
 const q=Math.sin(x/2)**2+
 Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;
 return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
}

function startGPS(){
 if(!navigator.geolocation)return show('المتصفح لا يدعم GPS');

 navigator.geolocation.watchPosition(p=>{
  position=p;
  const {latitude:lat,longitude:lng,accuracy,speed,heading}=p.coords;
  const direction=heading!=null&&!isNaN(heading)?Math.round(heading)+'°':'--';

  document.getElementById('gps').innerHTML=
   `🧭 ${direction} | 📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}`;

  if(!marker){
   marker=L.marker([lat,lng],{icon:boatIcon}).addTo(map);
   accuracyCircle=L.circle([lat,lng],{
    radius:accuracy,color:'#e63946',fillOpacity:.08
   }).addTo(map);
   map.setView([lat,lng],15);
  }else{
   marker.setLatLng([lat,lng]);
   accuracyCircle.setLatLng([lat,lng]).setRadius(accuracy);
  }

  if(heading!=null&&!isNaN(heading)){
   const boat=marker.getElement()?.querySelector('.boat-icon');
   if(boat)boat.style.transform=`rotate(${heading}deg)`;
  }

  const kmh=speed&&!isNaN(speed)?Math.max(0,speed*3.6):0;
  document.getElementById('speed').textContent=kmh.toFixed(1);

  if(tracking){
   maxSpeed=Math.max(maxSpeed,kmh);
   document.getElementById('max').textContent=maxSpeed.toFixed(1);
   track.push([lat,lng]);

   if(last)distance+=distanceKm(last[0],last[1],lat,lng);
   document.getElementById('distance').textContent=distance.toFixed(2);

   if(!line)line=L.polyline(track,{color:'#e63946',weight:4}).addTo(map);
   else line.setLatLngs(track);
  }

  last=[lat,lng];
 },()=>{
  show('⚠️ فعّل GPS واسمح بالوصول إلى الموقع');
 },{
  enableHighAccuracy:true,
  maximumAge:2000,
  timeout:10000
 });
}

function centerMe(){
 if(position)map.setView([
  position.coords.latitude,
  position.coords.longitude
 ],16);
 else show('⚠️ في انتظار GPS');
}

function toggleTrack(){
 tracking=!tracking;
 if(tracking){
  track=[];distance=0;maxSpeed=0;last=null;
  if(line){map.removeLayer(line);line=null}
  document.getElementById('distance').textContent='0.00';
  document.getElementById('max').textContent='0.0';
  show('🔴 بدأ تسجيل المسار');
 }else show('✅ تم إيقاف المسار');
}

function saveSpot(){
 if(!position)return show('⚠️ في انتظار GPS');
 const spots=JSON.parse(localStorage.getItem('spots')||'[]');
 spots.push({
  lat:position.coords.latitude,
  lng:position.coords.longitude,
  date:new Date().toLocaleString('ar')
 });
 localStorage.setItem('spots',JSON.stringify(spots));
 show('✅ تم حفظ النقطة');
}

function toggleSea(){
 if(sea){
  map.removeLayer(sea);sea=null;show('🌊 تم إخفاء علامات البحر');
 }else{
  sea=L.tileLayer(
   'https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',
   {maxZoom:18}
  ).addTo(map);
  show('🌊 تم عرض علامات البحر');
 }
}

function toggleDepth(){
 if(depth){
  map.removeLayer(depth);depth=null;show('📉 تم إخفاء الأعماق');
 }else{
  depth=L.tileLayer(
   'https://tiles.arcgis.com/tiles/P3ePLMYs2RVChkJx/arcgis/rest/services/World_Bathymetry/MapServer/tile/{z}/{y}/{x}',
   {maxZoom:15,opacity:.7}
  ).addTo(map);
  show('📊 تم عرض الأعماق');
 }
}

function show(message){
 const t=document.getElementById('toast');
 t.textContent=message;
 t.style.display='block';
 setTimeout(()=>t.style.display='none',2500);
}

startGPS();
</script>
</body>
</html>
