<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق الملاحة البحرية</title>
    <!-- استدعاء مكتبة Leaflet للخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* تصميم واجهة البيانات فوق الخريطة */
        .ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .metric { text-align: center; }
        .value { font-size: 20px; font-weight: bold; color: #064B66; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-overlay">
        <div class="metric">
            <div>السرعة</div>
            <div class="value">8.4 عقدة</div>
        </div>
        <div class="metric">
            <div>الاتجاه</div>
            <div class="value">045°</div>
        </div>
    </div>

    <script>
        // إعداد الخريطة
        var map = L.map('map').setView([36.8065, 10.1815], 13);

        // إضافة طبقة الخريطة (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // إضافة أيقونة القارب (علامة)
        var boatIcon = L.divIcon({
            html: '<div style="font-size: 30px;">⛵</div>',
            className: 'custom-div-icon'
        });

        L.marker([36.8065, 10.1815], {icon: boatIcon}).addTo(map)
            .bindPopup('موقعي الحالي');
    </script>
</body>
</html>
