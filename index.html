<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redline Fishing</title>
    <!-- تضمين Leaflet و Firebase -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: sans-serif; height: 100vh; }
        #splash-screen, #auth-screen, #app-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; z-index: 1000; }
        #app-screen { display: none; }
        #map { width: 100%; height: 60vh; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. شاشة الترحيب -->
    <div id="splash-screen"><img src="logo.png" alt="Logo"></div>

    <!-- 2. شاشة الدخول -->
    <div id="auth-screen" class="hidden">
        <h2>تسجيل الدخول</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة السر">
        <button onclick="login()">دخول</button>
    </div>

    <!-- 3. شاشة التطبيق الرئيسية -->
    <div id="app-screen" class="hidden">
        <div id="map"></div>
        <button onclick="getWeather()">جلب حالة الطقس</button>
        <button onclick="logout()">خروج</button>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script type="module">
        // استيراد Firebase (يحتاج إعداد)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";

        const firebaseConfig = { /* ضع بيانات مشروعك هنا */ };
        initializeApp(firebaseConfig);
        const auth = getAuth();

        // منطق التبديل بين الشاشات
        setTimeout(() => { document.getElementById('splash-screen').classList.add('hidden'); }, 2200);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').style.display = 'flex';
                initMap();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        // إعداد الخريطة
        let map;
        function initMap() {
            if (map) return;
            map = L.map('map').setView([36.8, 10.6], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            
            // أيقونة الكياك المخصصة
            const kayakIcon = L.icon({ iconUrl: 'images/kayak-icon.png', iconSize: [32, 32] });
            L.marker([36.8, 10.6], { icon: kayakIcon }).addTo(map);
        }

        // دالة الطقس
        async function getWeather() {
            const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=36.8&longitude=10.6&current=wind_speed_10m');
            const data = await res.json();
            alert("سرعة الرياح: " + data.current.wind_speed_10m + " كم/س");
        }

        // دالة تحويل DMS إلى إحداثيات (لإضافة موقع صديق)
        window.addFriendLocation = (deg, min, sec, dir, lonDeg, lonMin, lonSec, lonDir) => {
            const toDec = (d, m, s, dir) => (Number(d) + Number(m)/60 + Number(s)/3600) * (dir === 'S' || dir === 'W' ? -1 : 1);
            const lat = toDec(deg, min, sec, dir);
            const lon = toDec(lonDeg, lonMin, lonSec, lonDir);
            L.marker([lat, lon]).addTo(map).bindPopup("موقع الصديق").openPopup();
        };

        window.login = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
        window.logout = () => signOut(auth);
    </script>
</body>
