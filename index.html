<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redline Fishing Pro</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #f2f5f9; --card: #fff; --text: #203449; --accent: #d73546; }
        body.dark-mode { --bg: #1a1a1a; --card: #2d2d2d; --text: #f0f0f0; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; }
        header { padding: 15px; background: var(--card); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #map { position: fixed; top: 70px; bottom: 70px; width: 100%; z-index: 1; }
        nav { position: fixed; bottom: 0; width: 100%; height: 70px; display: flex; background: var(--card); align-items: center; justify-content: space-around; z-index: 1000; box-shadow: 0 -2px 5px rgba(0,0,0,0.1); }
        button { padding: 8px 15px; border-radius: 8px; border: none; background: var(--accent); color: white; cursor: pointer; }
        .modal { display: none; position: fixed; top: 20%; left: 10%; width: 80%; background: var(--card); padding: 20px; z-index: 2000; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<header>
    <div id="title">Redline Fishing</div>
    <div>
        <button id="langBtn">Français</button>
        <button id="themeBtn">🌙</button>
    </div>
</header>

<div id="map"></div>

<nav>
    <button id="locateBtn">📍</button>
    <button id="importBtn">📁</button>
    <button id="exportBtn">📤</button>
    <input type="file" id="fileInput" style="display:none" accept=".json">
</nav>

<!-- ملفات JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map = L.map('map').setView([36.77, 10.22], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let points = JSON.parse(localStorage.getItem('fishingPoints')) || [];

    // --- الوظائف الرئيسية ---

    // 1. اختيار الموقع من الخريطة
    map.on('click', function(e) {
        let name = prompt("أدخل اسم نقطة الصيد:");
        if (name) {
            let newPoint = { id: Date.now(), name, lat: e.latlng.lat, lon: e.latlng.lng };
            points.push(newPoint);
            saveAndRender();
        }
    });

    // 2. تحديث الخريطة (عرض النقاط)
    function saveAndRender() {
        localStorage.setItem('fishingPoints', JSON.stringify(points));
        renderPoints();
    }

    function renderPoints() {
        map.eachLayer(layer => { if (layer instanceof L.Marker) map.removeLayer(layer); });
        points.forEach(p => {
            let marker = L.marker([p.lat, p.lon]).addTo(map);
            // 3. تحرير النقاط (داخل الـ Popup)
            marker.bindPopup(`
                <b>${p.name}</b><br>
                <button onclick="editPoint(${p.id})">تعديل</button>
                <button onclick="deletePoint(${p.id})">حذف</button>
                <div id="weather-${p.id}">جاري جلب الطقس...</div>
            `).on('popupopen', () => fetchWeather(p));
        });
    }

    // جلب الطقس بالساعات (API)
    async function fetchWeather(p) {
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&hourly=temperature_2m`);
            const data = await res.json();
            const temp = data.hourly.temperature_2m[0] ?? "—";
            document.getElementById(`weather-${p.id}`).innerHTML = `حرارة: ${temp}°C`;
        } catch {
            document.getElementById(`weather-${p.id}`).innerHTML = "تعذر جلب الطقس";
        }
    }

    // أدوات التحرير والحذف
    window.editPoint = (id) => {
        let p = points.find(p => p.id === id);
        let newName = prompt("تعديل الاسم:", p.name);
        if (newName) { p.name = newName; saveAndRender(); }
    };
    window.deletePoint = (id) => {
        points = points.filter(p => p.id !== id);
        saveAndRender();
    };

    // 4. استيراد البيانات
    document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = (e) => {
        let file = e.target.files[0];
        let reader = new FileReader();
        reader.onload = (e) => {
            points = JSON.parse(e.target.result);
            saveAndRender();
        };
        reader.readAsText(file);
    };

    // تصدير البيانات
    document.getElementById('exportBtn').onclick = () => {
        let blob = new Blob([JSON.stringify(points)], {type: 'application/json'});
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a'); a.href = url; a.download = 'points.json'; a.click();
    };

    renderPoints();
</script>
</body>
</html>
